<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CV Builder – free offline CV &amp; resume maker</title>
<meta name="description" content="Make a professional CV or resume in minutes. Indian, European and Canadian styles, 4 templates, cover letter, CV score and job-advert checker. Free, works offline, nothing leaves your device.">
<meta name="theme-color" content="#4F46E5">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CV Builder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* ================= App UI — professional & colourful ================= */
:root{
  --ui:#4F46E5; --ui-dark:#3730A3; --ui-soft:#EEF2FF;
  --ink:#172033; --muted:#64708A; --line:#E3E7EF; --bg:#F4F6FB; --card:#fff;
  --ok:#16A34A; --warn:#D97706; --bad:#DC2626;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans',Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.ui-ico{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:9px 16px;background:#fff;padding-top:max(9px,env(safe-area-inset-top))}
.rainbow{height:3px;background:linear-gradient(90deg,#4F46E5,#7C3AED 22%,#DB2777 45%,#F59E0B 68%,#10B981 88%,#0EA5E9)}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:17px;white-space:nowrap;letter-spacing:-.01em}
.brand-logo{width:34px;height:34px;flex:none;display:inline-flex;filter:drop-shadow(0 3px 6px rgba(79,70,229,.28))}
.brand-logo svg{width:100%;height:100%;display:block}
.brand-big{font-size:19px;gap:11px}
.brand-big .brand-logo{width:48px;height:48px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4F46E5,#9333EA);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:800;letter-spacing:.5px;box-shadow:0 3px 8px rgba(79,70,229,.3)}
.brand small{font-weight:500;color:var(--muted);font-size:12px;margin-left:2px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:6px;min-width:0}
.icon-btn.top{width:auto;height:36px;padding:0 10px;gap:5px;display:inline-flex;align-items:center;border-radius:10px;color:#344054}
.icon-btn.top em{font-style:normal;font-size:13px;font-weight:600}
.icon-btn.top:disabled{opacity:.35}
.cv-switch{display:flex;align-items:center;gap:6px;max-width:44vw;border:1px solid var(--line);background:#F8F9FC;border-radius:999px;padding:7px 13px;font-weight:650;font-size:14px;color:var(--ink)}
.cv-switch .ui-ico{color:var(--ui);width:16px;height:16px}
.cv-switch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save-state{font-size:12px;color:var(--muted);white-space:nowrap}
.save-state.ok::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.save-state.bad{color:var(--bad)}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(390px,520px) 1fr}
.editor{overflow-y:auto;border-right:1px solid var(--line);background:var(--bg);-webkit-overflow-scrolling:touch}

/* tabs */
.tabs{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 14px;background:var(--bg)}
.tab{border:0;background:transparent;padding:9px 6px;border-radius:12px;font-weight:650;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;font-size:14.5px;transition:background .15s,color .15s}
.tab .ui-ico{color:var(--tc);opacity:.75}
.tab:hover{background:rgba(255,255,255,.6)}
.tab.active{background:#fff;color:var(--tc);box-shadow:var(--shadow),inset 0 -3px 0 var(--tc)}
.tab.active .ui-ico{opacity:1}
.panel{padding:4px 14px 120px}

/* privacy + notes */
.privacy{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,#ECFDF3,#F0FDFA);border:1px solid #ABEFC6;color:#05603A;border-radius:var(--radius);padding:11px 13px;font-size:13px;margin:4px 0 12px}
.privacy .ui-ico{color:#079455;margin-top:1px}
.privacy b{display:block}
.note-box{display:flex;gap:8px;align-items:center;background:#F8F9FC;border:1px dashed #D0D5DD;border-radius:10px;padding:9px 11px;font-size:13px;color:var(--muted);margin:0 0 12px}
.note-box .ui-ico{width:16px;height:16px}
.good-box{display:flex;gap:8px;align-items:center;background:#ECFDF3;border:1px solid #ABEFC6;color:#067647;border-radius:10px;padding:10px 12px;margin:0;font-weight:600;font-size:14px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow)}
.card>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;font-weight:650;user-select:none}
.card>summary::-webkit-details-marker{display:none}
.card[open]>summary{border-bottom:1px solid #F0F2F7}
.sec-ico{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff)}
.sec-ico .ui-ico{width:18px;height:18px}
.sec-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.sec-title .meta{font-weight:500;color:var(--muted);font-size:12.5px}
.state{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid #E3E7EF;color:transparent}
.state .ui-ico{width:13px;height:13px}
.state.done{background:var(--ok);border-color:var(--ok);color:#fff}
.card-body{padding:12px 14px 14px}
.card-static{padding:14px}
.card h3{margin:0 0 4px;font-size:15.5px}
.card-h{display:flex;align-items:center;gap:10px;margin:0 0 8px!important}
.card-h .sec-ico{width:30px;height:30px;border-radius:9px}
.card-h .sec-ico .ui-ico{width:16px;height:16px}
.hello{display:flex;align-items:center;gap:12px;justify-content:space-between;background:linear-gradient(135deg,#EEF2FF,#FDF2F8);border-color:#E0E7FF}
.hint{color:var(--muted);font-size:13px;margin:2px 0 10px}

/* form */
.field{display:block;margin-bottom:10px}
.field>span{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#344054;margin-bottom:4px}
.field input,.field select,.field textarea,.input{width:100%;border:1px solid #D0D5DD;border-radius:10px;padding:9px 11px;background:#fff;font-size:15px;outline:none;transition:border .15s,box-shadow .15s}
.field textarea,textarea.input{min-height:80px;resize:vertical;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{border-color:var(--ui);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--ui-soft);color:var(--ui-dark)}
.subhead{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-size:14px;color:#344054}
.weak{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.weak:empty{display:none}
.weak span{font-size:12.5px;background:#FFFAEB;border:1px solid #FEDF89;color:#93370D;border-radius:8px;padding:5px 9px}
.weak span::before{content:'⚠ '}

.seg{display:flex;background:#EBEEF5;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:650;font-size:14px;color:#475467;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.seg-icons{margin-bottom:12px;background:#fff;border:1px solid var(--line)}
.seg-icons button.on{background:var(--ui);color:#fff}
.style-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.style-opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:all .15s}
.style-opt .flag{font-size:20px;line-height:1.1}
.style-opt b{font-size:14px}
.style-opt small{font-size:11px;color:var(--muted)}
.style-opt:hover{border-color:#C7D2FE}
.style-opt.on{border-color:var(--ui);background:var(--ui-soft);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.style-note{font-size:13px;color:var(--muted);margin:10px 2px 0}

.btn{border:1px solid #D0D5DD;background:#fff;border-radius:10px;padding:9px 14px;font-weight:650;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);text-decoration:none}
.btn:hover{background:#F9FAFB}
.btn .ui-ico{width:16px;height:16px}
.btn.primary{background:linear-gradient(135deg,#4F46E5,#6D28D9);border-color:transparent;color:#fff;box-shadow:0 2px 6px rgba(79,70,229,.25)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.soft{background:var(--ui-soft);border-color:#E0E7FF;color:var(--ui-dark)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ui)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.big-start{padding:15px;font-size:16px;border-radius:13px}
.big-start .ui-ico{width:19px;height:19px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;width:32px;height:32px;display:inline-grid;place-items:center;font-size:14px;color:#475467;padding:0;text-decoration:none}
.icon-btn .ui-ico{width:16px;height:16px}
.icon-btn:hover{background:#F9FAFB}
.icon-btn:disabled{opacity:.35;cursor:default}

.entry{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#FBFCFE}
.entry-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.entry-head b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.date-pick{display:flex;gap:6px}
.date-pick select{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:2px 0 10px}
.check input{width:18px;height:18px;accent-color:var(--ui)}
.lang-row{display:grid;grid-template-columns:1fr 1fr 32px;gap:8px;margin-bottom:8px;align-items:center}

.photo-box{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.photo-frame{width:86px;height:86px;flex:none;overflow:hidden;background:linear-gradient(135deg,#EEF2FF,#F5F3FF);display:grid;place-items:center;color:#A5B4FC;border:1px solid var(--line)}
.photo-frame .ui-ico{width:38px;height:38px}
.photo-frame img{width:100%;height:100%;object-fit:cover}
.photo-frame.circle{border-radius:50%}.photo-frame.rounded{border-radius:14px}.photo-frame.square{border-radius:3px}
.photo-tools{flex:1;min-width:0}
.range{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px}
.range input{flex:1;accent-color:var(--ui)}
.sig-box{height:74px;border:1px dashed #C7D2FE;background:repeating-linear-gradient(0deg,#fff 0 32px,#F5F7FF 32px 33px);border-radius:10px;display:grid;place-items:center;margin-bottom:8px;overflow:hidden;color:var(--muted);font-size:13px}
.sig-box img{max-height:62px;max-width:90%}
.sig-pad-wrap{position:relative;border:2px dashed #C7D2FE;border-radius:12px;background:#FCFCFF;overflow:hidden}
.sig-pad-wrap canvas{display:block;touch-action:none;cursor:crosshair}
.sig-line{position:absolute;left:8%;right:8%;bottom:42px;border-top:1px solid #CBD5E1;pointer-events:none}

/* design */
.tpl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tpl{border:2px solid var(--line);border-radius:12px;background:#fff;padding:8px;text-align:left}
.tpl.on{border-color:var(--ui);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.tpl b{display:block;font-size:14px;margin-top:6px}
.tpl small{color:var(--muted);font-size:12px}
.thumb{height:92px;border-radius:6px;background:#fff;border:1px solid var(--line);position:relative;overflow:hidden}
.thumb i{position:absolute;display:block;border-radius:2px;background:#D0D5DD}
.swatches{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.sw-custom{position:relative;width:32px;height:32px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sw-custom.on{box-shadow:0 0 0 2px var(--ink)}
.sw-custom input{position:absolute;inset:-8px;width:48px;height:48px;opacity:0;cursor:pointer}
.font-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.font-opt{border:2px solid var(--line);border-radius:10px;background:#fff;padding:10px;text-align:left}
.font-opt.on{border-color:var(--ui)}
.font-opt span{display:block;font-size:20px;line-height:1.1}
.font-opt small{color:var(--muted);font-size:12px}
.sec-list{list-style:none;margin:0;padding:0}
.sec-list li{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line)}
.sec-list li:last-child{border-bottom:0}
.sec-list li span{flex:1;font-weight:600;font-size:14px}
.sec-list li.off span{color:#98A2B3;text-decoration:line-through}
.sec-list li em{font-style:normal;font-size:12px;color:var(--muted);font-weight:500}

/* download */
.score-card{background:linear-gradient(135deg,#fff 60%,#F5F3FF)}
.score{display:flex;align-items:center;gap:16px}
.ring{--p:0;--c:var(--ok);width:86px;height:86px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#EAECF0 0)}
.ring b{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px}
.tips{list-style:none;padding:0;margin:12px 0 0}
.tips li{display:flex;gap:8px;padding:6px 0;font-size:14px;border-top:1px dashed var(--line)}
.tips li i{font-style:normal;flex:none;width:20px;text-align:center;color:var(--warn)}
.tips li.good{color:var(--muted)}
.tips li.good i{color:var(--ok)}
.weak-list{list-style:none;margin:0;padding:0}
.weak-list li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 10px;border-radius:10px;background:#FFFAEB;border:1px solid #FEF0C7;margin-bottom:6px;font-size:13.5px}
.weak-list b{color:#93370D}
.weak-list span{color:var(--muted);text-align:right;font-size:12.5px}
.weak-list em{grid-column:1/-1;font-style:normal;color:#344054}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kw span{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid}
.kw .hit{background:#ECFDF3;border-color:#ABEFC6;color:#067647}
.kw .miss{background:#FEF3F2;border-color:#FECDCA;color:#B42318}
.dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dl-btn{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;transition:all .15s}
.dl-btn:hover{border-color:#C7D2FE;box-shadow:var(--shadow);transform:translateY(-1px)}
.dl-btn b{display:block;font-size:14px}
.dl-btn small{color:var(--muted);font-size:12px}
.dl-ico{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;background:var(--c)}
.dl-ico .ui-ico{width:20px;height:20px}
.help{font-size:13px;color:var(--muted);background:#F8F9FC;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}

/* jobs */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{border-radius:14px;padding:12px 10px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#000));color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 30%,transparent)}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;opacity:.92;font-weight:600}
.track-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:#475467}
.chip span{color:var(--muted);font-weight:500}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.chip.on span{color:rgba(255,255,255,.85)}
.job-card{display:flex;gap:10px;justify-content:space-between;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:11px 12px;margin-bottom:8px;background:#fff}
.job-main{min-width:0}
.job-main b{display:block;font-size:15px}
.job-main span{display:block;font-size:14px;color:#344054}
.job-main small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.job-main p{margin:6px 0 0;font-size:13px;color:#475467;background:#F8F9FC;border-radius:8px;padding:6px 8px}
.follow{display:inline-block;margin-top:5px;font-style:normal;font-size:12px;font-weight:650;color:#B54708;background:#FFFAEB;border:1px solid #FEDF89;border-radius:999px;padding:2px 9px}
.job-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.pill-select{border:0;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);outline:none}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.empty .ui-ico{width:40px;height:40px;color:#C7D2FE}
.empty b{display:block;color:var(--ink);margin:6px 0 2px}
.empty p{margin:0 auto;max-width:330px;font-size:13.5px}
.li-intro{background:linear-gradient(135deg,#fff 55%,#EFF6FF)}
.li-block{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.li-head b{display:block;font-size:14.5px}
.li-head small{color:var(--muted);font-size:12.5px}
.li-block textarea{margin-top:8px;font-size:14px}
.li-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.count{font-size:12.5px;color:var(--muted)}
.count.over{color:var(--bad);font-weight:700}
.progress{height:10px;border-radius:999px;background:#EEF0F5;overflow:hidden;margin-top:4px}
.progress div{height:100%;border-radius:999px;background:linear-gradient(90deg,#4F46E5,#DB2777,#F59E0B);transition:width .3s}
.star-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.star-grid div{border-radius:12px;padding:10px 8px;background:color-mix(in srgb,var(--c) 10%,#fff);border:1px solid color-mix(in srgb,var(--c) 25%,#fff);text-align:center}
.star-grid b{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 4px;border-radius:50%;background:var(--c);color:#fff;font-size:15px}
.star-grid span{display:block;font-weight:700;font-size:13px;color:var(--c)}
.star-grid small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.q-group{margin:16px 2px 8px;font-size:14px;color:#344054}
.q-card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.q-card>summary{list-style:none;display:flex;gap:10px;align-items:center;padding:11px 12px;cursor:pointer;font-weight:600;font-size:14.5px}
.q-card>summary::-webkit-details-marker{display:none}
.q-dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid #E3E7EF;color:transparent}
.q-dot .ui-ico{width:13px;height:13px}
.q-card.done .q-dot{background:var(--ok);border-color:var(--ok);color:#fff}
.q-body{padding:0 12px 12px}
.q-tip{margin:0 0 8px;font-size:13.5px;background:#F5F3FF;border-radius:10px;padding:8px 10px;color:#4C1D95}

/* preview */
.preview{display:flex;flex-direction:column;min-width:0;background:#E5E8F0}
.preview-bar{display:flex;align-items:center;gap:10px;padding:9px 16px;background:#fff;border-bottom:1px solid var(--line)}
.preview-bar .seg{width:220px}
.preview-bar .seg button{padding:6px}
.page-info{font-size:13px;color:var(--muted);margin-left:auto;text-align:right}
.page-info b{color:var(--ink)}
.page-info.over b{color:var(--warn)}
.close-preview{display:none}
.paper-wrap{flex:1;overflow:auto;padding:22px 16px 40px;-webkit-overflow-scrolling:touch}
.paper-sizer{position:relative;margin:0 auto}
.paper-sizer .paper-scale{position:absolute;top:0;left:0}
.paper-scale{transform-origin:top left;position:relative}
.paper{background:#fff;box-shadow:0 6px 24px rgba(16,24,40,.13),0 1px 3px rgba(16,24,40,.1);position:relative}
.page-break{position:absolute;left:0;right:0;border-top:2px dashed #F79009;pointer-events:none;z-index:5}
.page-break span{position:absolute;right:6px;top:-11px;background:#F79009;color:#fff;font:600 11px/1 -apple-system,Segoe UI,sans-serif;padding:4px 7px;border-radius:5px}
.fab{display:none}

/* modal / sheet */
.modal{position:fixed;inset:0;z-index:100;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#fff;border-radius:18px;width:100%;max-width:580px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:17px;flex:1}
.sheet-body{padding:14px 16px;overflow-y:auto}
.sheet-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.list-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.list-item.on{border-color:var(--ui);background:var(--ui-soft)}
.list-item .grow{flex:1;min-width:0}
.list-item .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .grow small{color:var(--muted)}
.open-now{color:var(--ui);font-weight:650}
.phrase{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.phrase:hover{border-color:var(--ui);background:var(--ui-soft)}
.phrase::before{content:'+ ';color:var(--ui);font-weight:700}
.verbs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.verbs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px}
.verbs button:hover{border-color:var(--ui);color:var(--ui)}
.sample-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sample-card{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 12px;transition:all .15s}
.sample-card:hover{border-color:color-mix(in srgb,var(--ui) 40%,#fff);box-shadow:var(--shadow);transform:translateY(-1px)}
.s-ico{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;background:var(--c)}
.s-txt{min-width:0}
.s-txt b{display:block;font-size:14px}
.s-txt small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.s-txt em{display:block;font-style:normal;font-size:11.5px;color:#475467;margin-top:3px;font-weight:600}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#172033;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:200;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* welcome */
#welcome{min-height:100vh;background:radial-gradient(1200px 500px at 10% -10%,#E0E7FF 0,transparent 60%),radial-gradient(900px 400px at 110% 0,#FCE7F3 0,transparent 55%),var(--bg)}
.welcome{max-width:640px;margin:0 auto;padding:34px 18px 60px}
.welcome h1{font-size:30px;margin:14px 0 6px;line-height:1.2;letter-spacing:-.02em;background:linear-gradient(90deg,#312E81,#6D28D9 60%,#BE185D);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p.lead{color:var(--muted);margin:0 0 18px}
.w-h{margin:24px 0 10px;font-size:16px}

@media (max-width: 900px){
  #app{display:block;height:auto}
  .layout{display:block}
  .topbar{position:static;padding:9px 12px;gap:8px}
  .editor{overflow:visible;border:0}
  .tabs{top:0;padding:max(8px,env(safe-area-inset-top)) 10px 8px;gap:3px}
  .tab{flex-direction:column;gap:2px;font-size:12px;padding:7px 2px}
  .tab .ui-ico{width:20px;height:20px}
  .preview{position:fixed;inset:0;z-index:60;visibility:hidden;transform:translateY(100%);transition:transform .25s ease,visibility 0s linear .25s}
  body.show-preview .preview{visibility:visible;transform:none;transition:transform .25s ease}
  body.show-preview{overflow:hidden}
  .close-preview{display:inline-flex}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;align-items:center;gap:7px;border:0;background:linear-gradient(135deg,#172033,#3730A3);color:#fff;border-radius:999px;padding:13px 18px;font-weight:700;box-shadow:0 8px 24px rgba(16,24,40,.3)}
  .fab small{opacity:.7;font-weight:500}
  body[data-tab="jobs"] .fab{display:none}
  .save-state{display:none}
  .brand small{display:none}
  .icon-btn.top em{display:none}
  .preview-bar{padding:max(10px,env(safe-area-inset-top)) 10px 10px;gap:8px}
  .preview-bar .seg{width:auto;flex:none}
  .preview-bar .seg button{padding:6px 10px;white-space:nowrap;font-size:13px}
  .preview-bar .btn.small{padding:6px 9px}
  .page-info{font-size:12px}
  .pi-long{display:none}
  .paper-wrap{padding:14px 8px 40px}
  .modal{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:90vh;padding-bottom:env(safe-area-inset-bottom)}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width: 520px){
  .sample-grid{grid-template-columns:1fr}
  .dl-grid{grid-template-columns:1fr}
  .star-grid{grid-template-columns:repeat(2,1fr)}
  .hello{flex-direction:column;align-items:flex-start}
}
@media (max-width: 380px){
  .brand-name{display:none}
}

/* ================= CV paper ================= */
.cv{
  --accent:#1F3A5F; --tint:#eef2f7; --font:Helvetica,Arial,sans-serif; --fs:10.5pt;
  font-family:var(--font); font-size:var(--fs); line-height:1.34; color:#1d2230;
  padding:14mm 16mm 12mm; -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.cv *{box-sizing:border-box}
.cv a{color:inherit;text-decoration:none}
.cv p{margin:0}
.cv-name{font-size:2.35em;line-height:1.08;font-weight:700;color:var(--accent);letter-spacing:-.01em;margin:0}
.cv-title{font-size:1.15em;color:#3b4252;margin-top:1.2mm;font-weight:500}
.cv-contact{display:flex;flex-wrap:wrap;gap:1.2mm 5mm;margin-top:2.4mm;font-size:.92em;color:#3b4252}
.cv-contact span{white-space:nowrap;display:inline-flex;align-items:center}
.cv-ico{width:1.05em;height:1.05em;flex:none;margin-right:1.3mm;color:var(--accent)}
.cv-photo{overflow:hidden;flex:none;background:#eef0f4;width:31mm;height:31mm}
.cv-photo img{width:100%;height:100%;object-fit:cover;display:block}
.cv-photo.circle{border-radius:50%}.cv-photo.rounded{border-radius:3.5mm}.cv-photo.square{border-radius:.5mm}
.cv-qr{width:19mm;height:19mm;flex:none}
.cv-qr svg{width:100%;height:100%;display:block}
.cv-qr-cap{font-size:.62em;color:#667085;text-align:center;margin-top:.6mm;letter-spacing:.02em}
.cv-section{margin-top:4.6mm}
.cv-h{font-size:.98em;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin:0 0 2mm;padding-bottom:1mm;border-bottom:.35mm solid var(--accent);break-after:avoid;page-break-after:avoid}
.cv-entry{margin-bottom:2.7mm;break-inside:avoid;page-break-inside:avoid}
.cv-entry:last-child{margin-bottom:0}
.cv-entry-head{display:flex;justify-content:space-between;gap:4mm;align-items:baseline}
.cv-entry-title{font-weight:700}
.cv-entry-title .org{font-weight:500}
.cv-date{white-space:nowrap;color:#4a5263;font-size:.92em;flex:none}
.cv-entry-sub{color:#4a5263;font-size:.95em}
.cv-bullets{margin:1.1mm 0 0;padding-left:4.5mm}
.cv-bullets li{margin:.5mm 0;padding-left:.5mm}
.cv-bullets li::marker{color:var(--accent)}
.cv-skill-line{margin:.6mm 0}
.cv-skill-line b{font-weight:700}
.cv-inline{line-height:1.5}
.cv-personal{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:.6mm 5mm}
.cv-personal dt{font-weight:600;color:#3b4252}
.cv-personal dd{margin:0}
.cv-lang{display:flex;flex-wrap:wrap;gap:1mm 6mm}
.cv-lang span b{font-weight:600}
.cv-pubs{margin:0;padding-left:4.5mm}
.cv-pubs li{margin:.6mm 0;break-inside:avoid}
.cv-decl{break-inside:avoid;page-break-inside:avoid}
.cv-sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:5mm}
.cv-sign .sig{text-align:right}
.cv-sign .sig b{display:block;margin-top:1mm}
.cv-signature{display:block;max-height:14mm;max-width:48mm;margin:0 0 1mm auto;mix-blend-mode:multiply}
.letter-sign{min-height:9mm;margin-top:2mm}
.letter-sign .cv-signature{margin:0 0 1mm 0}
.cv.bw .cv-photo img{filter:grayscale(1)}
.cv-dots{display:inline-flex;gap:1mm;margin-left:2mm;vertical-align:middle}
.cv-dots i{width:1.9mm;height:1.9mm;border-radius:50%;background:currentColor;opacity:.25}
.cv-dots i.f{opacity:1}

/* --- Classic --- */
.t-classic .cv-header{display:flex;align-items:center;gap:6mm;padding-bottom:1mm}
.t-classic .cv-header-text{flex:1;min-width:0}
.t-classic.no-photo .cv-header{text-align:center}
.t-classic.no-photo .cv-contact{justify-content:center}
.t-classic.no-photo.has-qr .cv-header{text-align:left}
.t-classic.no-photo.has-qr .cv-contact{justify-content:flex-start}

/* --- Modern --- */
.t-modern{padding-top:0}
.t-modern .cv-band{background:var(--accent);color:#fff;margin:0 -16mm;padding:11mm 16mm 9mm;display:flex;align-items:center;gap:6mm}
.t-modern .cv-header-text{flex:1;min-width:0}
.t-modern .cv-name{color:#fff}
.t-modern .cv-title{color:rgba(255,255,255,.88)}
.t-modern .cv-contact{color:rgba(255,255,255,.92)}
.t-modern .cv-ico{color:#fff;opacity:.92}
.t-modern .ico-in{stroke:var(--accent)}
.t-modern .cv-photo{box-shadow:0 0 0 1mm rgba(255,255,255,.9)}
.t-modern .cv-qr{padding:1mm;background:#fff;border-radius:1mm;width:21mm;height:21mm}
.t-modern .cv-qr-cap{color:rgba(255,255,255,.85)}
.t-modern .cv-h{border:0;padding:0 0 0 3mm;border-left:1.3mm solid var(--accent);line-height:1.1}

/* --- Sidebar --- */
.t-sidebar{padding:0;display:grid;grid-template-columns:64mm 1fr;min-height:inherit;background:linear-gradient(to right,var(--tint) 0,var(--tint) 64mm,#fff 64mm)}
.t-sidebar .cv-aside{padding:14mm 7mm 10mm 9mm;font-size:.94em}
.t-sidebar .cv-main{padding:14mm 14mm 10mm 9mm;min-width:0}
.t-sidebar .cv-photo{width:36mm;height:36mm;margin:0 auto 6mm}
.t-sidebar .cv-aside .cv-section:first-of-type{margin-top:0}
.t-sidebar .cv-aside .cv-h{font-size:.95em;border-bottom-width:.3mm}
.t-sidebar .cv-aside .cv-contact{display:block;margin:0;color:#2b3242}
.t-sidebar .cv-aside .cv-contact span{display:block;white-space:normal;word-break:break-word;margin-bottom:1.3mm}
.t-sidebar .cv-aside .cv-contact span+span::before{display:none}
.t-sidebar .cv-aside .cv-contact span b{display:block;font-size:.85em;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.t-sidebar .cv-aside .cv-skill-line{margin:0 0 1.6mm}
.t-sidebar .cv-aside .cv-skill-line b{display:block}
.t-sidebar .cv-aside .cv-lang{display:block}
.cv-lang-row{display:flex;justify-content:space-between;align-items:center;gap:2mm;margin-bottom:1.5mm}
.cv-lang-row b{font-weight:600;display:block}
.cv-lang-row small{display:block;color:#4a5263;font-size:.86em}
.t-sidebar .cv-aside .cv-lang .cv-dots{color:var(--accent)}
.t-sidebar .cv-aside .cv-personal{display:block}
.t-sidebar .cv-aside .cv-personal dt{font-size:.85em;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.t-sidebar .cv-aside .cv-personal dd{margin-bottom:1.3mm}
.t-sidebar .cv-aside .cv-qr{margin:2mm 0 0}
.t-sidebar .cv-aside .cv-qr-cap{text-align:left}
.t-sidebar .cv-main .cv-name{font-size:2.2em}
.t-sidebar .cv-main>.cv-section:first-of-type{margin-top:6mm}

/* --- Timeline --- */
.t-timeline .cv-header{display:flex;align-items:flex-end;gap:6mm;padding-bottom:4mm;border-bottom:.3mm solid #c9ced8}
.t-timeline .cv-header-text{flex:1;min-width:0}
.t-timeline .cv-name{font-weight:600;letter-spacing:.01em}
.t-timeline .cv-h{border:0;padding:0;text-transform:none;letter-spacing:.01em;font-size:1.22em;font-weight:600;display:flex;align-items:center;gap:3mm}
.t-timeline .cv-h::after{content:'';flex:1;height:.3mm;background:var(--accent);opacity:.35}
.t-timeline .cv-entry{display:grid;grid-template-columns:31mm 1fr;gap:4mm}
.t-timeline .cv-entry .cv-date{color:var(--accent);font-weight:600;white-space:normal}
.t-timeline .cv-entry-head{display:block}
.t-timeline .tl-pad{padding-left:35mm}

/* Size */
.cv.size-s{--fs:9.5pt}.cv.size-m{--fs:10.5pt}.cv.size-l{--fs:11.5pt}

/* Cover letter */
.cv-letter .letter-body{margin-top:9mm;line-height:1.55}
.cv-letter .letter-body p{margin:0 0 3.6mm}
.cv-letter .letter-to{margin-top:8mm;line-height:1.45}
.cv-letter .letter-date{margin-top:7mm;color:#4a5263}
.cv-letter .letter-subject{font-weight:700;margin-top:6mm}
.cv-letter.letter-side{border-left:9mm solid var(--tint);padding-left:14mm}
.cv-letter .cv-header{text-align:left!important}
.cv-letter .cv-contact{justify-content:flex-start!important}

/* ================= Print ================= */
#printArea{display:none}
@media print{
  html,body{background:#fff!important;height:auto}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .cv{padding-bottom:0}
  #printArea .t-sidebar .cv-aside,#printArea .t-sidebar .cv-main{padding-bottom:0}
}

/* ---------- Tiny QR code generator (byte mode, ECC level M) ----------

  const FORMAT_M = 0;

  function rawModules(ver) {
    let r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const n = Math.floor(ver / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (ver >= 7) r -= 36;
    }
    return r;
  }
  const dataCodewords = v => Math.floor(rawModules(v) / 8) - ECC_M[v] * BLK_M[v];

  function gfMul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11D);
      z ^= ((y >>> i) & 1) * x;
    }
    return z;
  }
  function rsDivisor(deg) {
    const r = new Array(deg).fill(0); r[deg - 1] = 1;
    let root = 1;
    for (let i = 0; i < deg; i++) {
      for (let j = 0; j < r.length; j++) {
        r[j] = gfMul(r[j], root);
        if (j + 1 < r.length) r[j] ^= r[j + 1];
      }
      root = gfMul(root, 2);
    }
    return r;
  }
  function rsRemainder(data, div) {
    const r = div.map(() => 0);
    for (const b of data) {
      const f = b ^ r.shift();
      r.push(0);
      div.forEach((c, i) => { r[i] ^= gfMul(c, f); });
    }
    return r;
  }

  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = 1;
    for (; ver <= 40; ver++) {
      const cc = ver < 10 ? 8 : 16;
      if (4 + cc + bytes.length * 8 <= dataCodewords(ver) * 8) break;
    }
    if (ver > 40) throw new Error('Text too long for a QR code');
    const size = ver * 4 + 17;
    // --- bit stream
    const bits = [];
    const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, ver < 10 ? 8 : 16);
    bytes.forEach(b => put(b, 8));
    const cap = dataCodewords(ver) * 8;
    put(0, Math.min(4, cap - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) {
      let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b);
    }
    // --- ECC + interleave
    const nb = BLK_M[ver], eccLen = ECC_M[ver], raw = Math.floor(rawModules(ver) / 8);
    const nShort = nb - raw % nb, shortLen = Math.floor(raw / nb);
    const div = rsDivisor(eccLen), blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1));
      k += dat.length;
      const ecc = rsRemainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const all = [];
    for (let i = 0; i < blocks[0].length; i++)
      blocks.forEach((bl, j) => { if (i !== shortLen - eccLen || j >= nShort) all.push(bl[i]); });

    // --- matrix
    const mod = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setF = (x, y, d) => { mod[y][x] = d; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) setF(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const align = [];
    if (ver > 1) {
      const n = Math.floor(ver / 7) + 2;
      const step = Math.floor((ver * 8 + n * 3 + 5) / (n * 4 - 4)) * 2;
      for (let p = size - 7; align.length < n - 1; p -= step) align.unshift(p);
      align.unshift(6);
    }
    align.forEach((ax, i) => align.forEach((ay, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === align.length - 1) || (i === align.length - 1 && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        setF(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }));
    const bit = (v, i) => ((v >>> i) & 1) !== 0;
    const drawFormat = mask => {
      const d = (FORMAT_M << 3) | mask;
      let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const b = ((d << 10) | rem) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setF(8, i, bit(b, i));
      setF(8, 7, bit(b, 6)); setF(8, 8, bit(b, 7)); setF(7, 8, bit(b, 8));
      for (let i = 9; i < 15; i++) setF(14 - i, 8, bit(b, i));
      for (let i = 0; i < 8; i++) setF(size - 1 - i, 8, bit(b, i));
      for (let i = 8; i < 15; i++) setF(8, size - 15 + i, bit(b, i));
      setF(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const b = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const c = bit(b, i), a = size - 11 + i % 3, bb = Math.floor(i / 3);
        setF(a, bb, c); setF(bb, a, c);
      }
    }
    // codewords
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!fn[y][x] && i < all.length * 8) { mod[y][x] = bit(all[i >>> 3], 7 - (i & 7)); i++; }
      }
    }
    const maskFn = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x) => x % 3 === 0,
      (x, y) => (x + y) % 3 === 0, (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
      (x, y) => x * y % 2 + x * y % 3 === 0, (x, y) => (x * y % 2 + x * y % 3) % 2 === 0,
      (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
    const applyMask = m => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++)
        if (!fn[y][x] && maskFn[m](x, y)) mod[y][x] = !mod[y][x];
    };
    const penalty = () => {
      let s = 0;
      const lineScore = get => {
        for (let a = 0; a < size; a++) {
          let run = 1;
          for (let b = 1; b <= size; b++) {
            if (b < size && get(a, b) === get(a, b - 1)) run++;
            else { if (run >= 5) s += run - 2; run = 1; }
          }
          for (let b = 0; b + 6 < size; b++) {
            const pat = [1, 0, 1, 1, 1, 0, 1].every((v, k) => get(a, b + k) === !!v);
            if (!pat) continue;
            const before = b >= 4 && [1, 2, 3, 4].every(k => !get(a, b - k));
            const after = b + 10 < size && [7, 8, 9, 10].every(k => !get(a, b + k));
            if (before || after) s += 40;
          }
        }
      };
      lineScore((a, b) => mod[a][b]);
      lineScore((a, b) => mod[b][a]);
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
        const c = mod[y][x];
        if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) s += 3;
      }
      let dark = 0; mod.forEach(r => r.forEach(c => { if (c) dark++; }));
      const t = size * size;
      s += (Math.ceil(Math.abs(dark * 20 - t * 10) / t) - 1) * 10;
      return s;
    };
    let best = 0, bestScore = Infinity;
    for (let m = 0; m < 8; m++) {
      applyMask(m); drawFormat(m);
      const p = penalty();
      if (p < bestScore) { bestScore = p; best = m; }
      applyMask(m);
    }
    applyMask(best); drawFormat(best);
    return { size, modules: mod };
  }

  /* Returns an SVG string. */
  function svg(text, color = '#000') {
    const { size, modules } = encode(text);
    const q = 2, n = size + q * 2;
    let d = '';
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++)
      if (modules[y][x]) d += `M${x + q},${y + q}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="${color}"/></svg>`;
  }
  return { encode, svg };
})();

    })).join('');
    case 'achievements': return (cv.achievements || []).filter(e => has(e.title)).map(e => entryHTML(tpl, {
      title: e.title, org: e.org, place: '', date: e.year || '', body: has(e.desc) ? `<p>${nl2br(e.desc.trim())}</p>` : ''
    })).join('');
    case 'responsibilities': case 'volunteering': return (cv[key] || []).filter(e => has(e.role) || has(e.org)).map(e => entryHTML(tpl, {
      title: e.role, org: e.org, place: e.city, date: fmtRange(e.start, e.end, e.current, cv), body: bulletsHTML(e.bullets)
    })).join('');
    case 'publications': { const ls = lines(cv.publications); return ls.length ? `<ul class="cv-pubs">${ls.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : ''; }
    case 'skills': return skillsHTML(cv, aside);
    case 'languages': return langsHTML(cv, aside);
    case 'interests': return has(cv.interests) ? `<p class="cv-inline">${nl2br(cv.interests.trim())}</p>` : '';
    case 'references':
      return has(cv.references) ? `<p>${nl2br(cv.references.trim())}</p>` : '';
  }
  if (key.startsWith('custom:')) {
    const c = (cv.custom || []).find(x => 'custom:' + x.id === key);
    if (!c || !has(c.body)) return '';
    const ls = lines(c.body);
    return ls.length > 1 ? `<ul class="cv-bullets">${ls.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : `<p>${esc(ls[0])}</p>`;
  }
  return '';
}

function declHTML(cv) {
  const d = cv.declaration || {};
  if (!STYLE_FIELDS[cv.style].declaration || !has(d.text) || (cv.hidden && cv.hidden.declaration)) return '';
  const L = LABELS.en;
  return `<section class="cv-section cv-decl" data-sec="declaration"><h2 class="cv-h">${L.declaration}</h2><p>${esc(d.text.trim())}</p>
    <div class="cv-sign"><div>${L.date}: ${d.date ? esc(fmtDay(d.date, cv)) : ''}<br>${L.place}: ${esc(d.place || '')}</div>
    <div class="sig">${sigHTML(cv)}<b>(${esc(cv.personal.fullName || '')})</b></div></div></section>`;
}

const sigHTML = cv => /^data:image\//.test(cv.signature || '') ? `<img class="cv-signature" alt="" src="${cv.signature}">` : '&nbsp;';
const accentOf = cv => cv.design.bw ? '#1F2328' : safeHex(cv.design.color);
function styleVars(cv) {
  const d = cv.design, color = accentOf(cv);
  return `--accent:${color};--tint:${d.bw ? '#F1F2F4' : tint(color)};--font:${(FONTS[d.font] || FONTS.sans).css}`;
}
function nameHTML(cv) {
  const p = cv.personal;
  return `<h1 class="cv-name">${has(p.fullName) ? esc(p.fullName) : '<span style="opacity:.35">Your Name</span>'}</h1>${has(p.title) ? `<div class="cv-title">${esc(p.title)}</div>` : ''}`;
}

/* ---------- CV ---------- */
function renderCV(cv) {
  const d = cv.design, tpl = TEMPLATES[d.template] ? d.template : 'classic';
  const L = LABELS[langOf(cv)];
  const photo = photoHTML(cv), qr = qrHTML(cv);
  const hidden = cv.hidden || {};
  const order = (cv.order || SECTION_KEYS).filter(k => !hidden[k]);
  const pItems = personalItems(cv);
  const cls = ['cv', 't-' + tpl, 'size-' + (d.size || 'm'), photo ? 'has-photo' : 'no-photo', qr ? 'has-qr' : '', 'st-' + cv.style, d.bw ? 'bw' : ''].join(' ');

  const section = (k, aside) => {
    const inner = secContent(k, cv, tpl, aside);
    if (!inner) return '';
    const pad = tpl === 'timeline' && !ENTRY_KEYS.includes(k);
    return `<section class="cv-section" data-sec="${k}"><h2 class="cv-h">${esc(sectionTitle(k, cv))}</h2>${pad ? `<div class="tl-pad">${inner}</div>` : inner}</section>`;
  };

  if (tpl === 'sidebar') {
    const asideKeys = ['skills', 'languages', 'interests'];
    const contact = contactItems(cv);
    const aside = [
      photo,
      contact.length ? `<section class="cv-section" data-sec="contact"><h2 class="cv-h">${L.contact}</h2><div class="cv-contact">${contact.map(([k, v]) => `<span><b>${esc(k)}</b>${v}</span>`).join('')}</div></section>` : '',
      pItems.length && !hidden.personal ? `<section class="cv-section" data-sec="personal"><h2 class="cv-h">${L.personal}</h2>${personalDL(pItems)}</section>` : '',
      ...order.filter(k => asideKeys.includes(k)).map(k => section(k, true)),
      qr
    ].join('');
    const main = order.filter(k => !asideKeys.includes(k)).map(k => section(k, false)).join('');
    return `<div class="${cls}" style="${styleVars(cv)}"><aside class="cv-aside">${aside}</aside><div class="cv-main">${nameHTML(cv)}${main}${declHTML(cv)}</div></div>`;
  }

  // contact line (Europe adds date of birth + nationality here)
  let contact = contactItems(cv).map(([, v, k]) => `<span>${ico(k)}${v}</span>`);
  if (cv.style === 'euro' && !hidden.personal) contact = contact.concat(euroHeaderItems(cv));
  const contactHTML = contact.length ? `<div class="cv-contact">${contact.join('')}</div>` : '';

  let header;
  if (tpl === 'modern') header = `<div class="cv-band">${photo}<div class="cv-header-text">${nameHTML(cv)}${contactHTML}</div>${qr}</div>`;
  else if (tpl === 'timeline') header = `<header class="cv-header"><div class="cv-header-text">${nameHTML(cv)}${contactHTML}</div>${photo}${qr}</header>`;
  else header = `<header class="cv-header">${photo}<div class="cv-header-text">${nameHTML(cv)}${contactHTML}</div>${qr}</header>`;

  const body = order.map(k => section(k, false)).join('');
  let personal = '';
  if (cv.style !== 'euro' && pItems.length && !hidden.personal) {
    const dl = personalDL(pItems);
    personal = `<section class="cv-section" data-sec="personal"><h2 class="cv-h">${L.personal}</h2>${tpl === 'timeline' ? `<div class="tl-pad">${dl}</div>` : dl}</section>`;
  }
  return `<div class="${cls}" style="${styleVars(cv)}">${header}${body}${personal}${declHTML(cv)}</div>`;
}

/* ---------- Cover letter ---------- */
function letterDefaults(cv) {
  const de = langOf(cv) === 'de';
  return {
    closing: de ? 'Mit freundlichen Grüßen' : cv.style === 'canada' ? 'Sincerely,' : 'Yours sincerely,',
    greeting: name => de ? (name ? `Guten Tag ${name},` : 'Sehr geehrte Damen und Herren,') : (name ? `Dear ${name},` : 'Dear Hiring Manager,'),
    subject: job => de ? `Bewerbung als ${job}` : `Application for the position of ${job}`
  };
}
function renderLetter(cv) {
  const d = cv.design, lt = cv.letter || {}, def = letterDefaults(cv);
  const side = d.template === 'sidebar';
  const tpl = side ? 'classic' : (TEMPLATES[d.template] ? d.template : 'classic');
  const cls = ['cv', 'cv-letter', 't-' + tpl, side ? 'letter-side' : '', 'size-' + (d.size || 'm'), 'no-photo', 'st-' + cv.style, d.bw ? 'bw' : ''].join(' ');
  const contact = contactItems(cv).map(([, v, k]) => `<span>${ico(k)}${v}</span>`);
  const contactHTML = contact.length ? `<div class="cv-contact">${contact.join('')}</div>` : '';
  const header = tpl === 'modern'
    ? `<div class="cv-band"><div class="cv-header-text">${nameHTML(cv)}${contactHTML}</div></div>`
    : `<header class="cv-header"><div class="cv-header-text">${nameHTML(cv)}${contactHTML}</div></header>`;
  const to = [lt.recipient, lt.recipientTitle, lt.company, ...lines(lt.address)].filter(has);
  const paras = String(lt.body || '').trim()
    ? String(lt.body).trim().split(/\n\s*\n|\n/).map(s => s.trim()).filter(Boolean)
    : null;
  const bodyHTML = paras
    ? paras.map(p => `<p>${esc(p)}</p>`).join('')
    : `<p style="color:#98A2B3">Your letter text will appear here. Open “Cover letter” in the Write tab and tap “Write a first draft for me”.</p>`;
  return `<div class="${cls}" style="${styleVars(cv)}">${header}
    <div class="letter-date">${esc(fmtDay(lt.date || todayISO(), cv, true))}</div>
    ${to.length ? `<div class="letter-to">${to.map(esc).join('<br>')}</div>` : ''}
    ${has(lt.jobTitle) ? `<div class="letter-subject">${esc(def.subject(lt.jobTitle.trim()))}</div>` : ''}
    <div class="letter-body"><p>${esc(has(lt.greeting) ? lt.greeting : def.greeting((lt.recipient || '').trim()))}</p>${bodyHTML}
    <p style="margin-top:6mm">${esc(has(lt.closing) ? lt.closing : def.closing)}</p><div class="letter-sign">${sigHTML(cv)}</div><p><b>${esc(cv.personal.fullName || '')}</b></p></div></div>`;
}

function draftLetter(cv) {
  const p = cv.personal, lt = cv.letter || {};
  const job = has(lt.jobTitle) ? lt.jobTitle.trim() : '[job title]';
  const company = has(lt.company) ? lt.company.trim() : '[company name]';
  const exp = (cv.experience || []).filter(e => has(e.role) || has(e.org));
  const skills = lines(cv.skills).flatMap(l => (l.includes(':') ? l.slice(l.indexOf(':') + 1) : l).split(',')).map(s => s.replace(/\(.*?\)/g, '').trim()).filter(Boolean).slice(0, 3);
  let years = 0;
  exp.forEach(e => {
    const s = parseInt(e.start), en = e.current ? new Date().getFullYear() : parseInt(e.end);
    if (s && en && en >= s) years += en - s;
  });
  const skillText = skills.length ? skills.join(', ').replace(/, ([^,]*)$/, ' and $1') : '[your key skills]';
  if (langOf(cv) === 'de') {
    const e0 = exp[0];
    return [
      `mit großem Interesse bewerbe ich mich als ${job} bei ${company}.`,
      e0 ? `Derzeit arbeite ich als ${e0.role || '[Position]'} bei ${e0.org || '[Firma]'}. Dabei habe ich fundierte Kenntnisse in ${skillText} aufgebaut.` : `Im Studium habe ich fundierte Kenntnisse in ${skillText} aufgebaut.`,
      `${company} interessiert mich besonders, weil [Grund nennen]. Gerne möchte ich meine Erfahrung in Ihr Team einbringen.`,
      `Über eine Einladung zu einem persönlichen Gespräch freue ich mich sehr.`
    ].join('\n\n');
  }
  const intro = `I am writing to apply for the ${job} position at ${company}. ` + (exp.length && years >= 1
    ? `As a ${(p.title || '').split(/\s[|–—-]\s|\|/)[0].trim() || '[your profession]'} with ${years}+ years of experience, I am confident I can add value to your team from day one.`
    : `As a motivated ${p.title || '[your degree] graduate'}, I am eager to bring my skills and energy to your team.`);
  let middle;
  const e0 = exp[0];
  if (e0) {
    const verbStart = s => ALL_VERBS.has((s.split(/\s+/)[0] || '').toLowerCase().replace(/[^a-z]/g, ''));
    const bl = lines(e0.bullets).filter(verbStart);
    const b = bl.find(x => /\d/.test(x)) || bl[0];
    const lowerFirst = s => /^[A-Z][a-z]/.test(s) ? s.charAt(0).toLowerCase() + s.slice(1) : s;
    const did = b ? `I ${lowerFirst(b).replace(/\.$/, '')}.` : 'I [describe a key achievement].';
    middle = `${e0.current ? 'In my current role' : 'In my previous role'} as ${e0.role || '[role]'} at ${e0.org || '[company]'}, ${did} I have also built strong skills in ${skillText}, which match what this role needs.`;
  } else {
    const pr = (cv.projects || []).find(x => has(x.name));
    middle = `During my studies${pr ? `, I worked on a project on ${pr.name.trim()}` : ''}, and I developed practical skills in ${skillText}. I learn quickly and enjoy taking responsibility.`;
  }
  return [
    intro.replace(/\.\./g, '.'),
    middle.replace(/\.\./g, '.'),
    `I am particularly interested in ${company.replace(/\.$/, '')} because [say what attracts you to the company]. I would welcome the chance to discuss how I can support your goals.`,
    `Thank you for your time and consideration. I look forward to hearing from you.`
  ].join('\n\n');
}

/* ---------- Plain text (for job portals) ---------- */
function plainText(cv) {
  const p = cv.personal, L = LABELS[langOf(cv)], hidden = cv.hidden || {};
  const out = [];
  const head = (t) => { out.push(''); out.push(t.toUpperCase()); };
  out.push(p.fullName || '');
  if (has(p.title)) out.push(p.title);
  const c = [p.email, p.phone, [p.city, p.country].filter(has).join(', '), shortUrl(p.linkedin), shortUrl(p.website)].filter(has);
  if (c.length) out.push(c.join(' | '));
  const pItems = personalItems(cv);
  if (cv.style === 'euro' && pItems.length && !hidden.personal) out.push(pItems.map(([k, v]) => `${k}: ${v}`).join(' | '));
  (cv.order || SECTION_KEYS).filter(k => !hidden[k]).forEach(k => {
    let body = [];
    if (k === 'summary' && has(cv.summary)) body = [cv.summary.trim()];
    if (k === 'experience') cv.experience.filter(e => has(e.role) || has(e.org)).forEach(e => {
      const r = fmtRange(e.start, e.end, e.current, cv);
      body.push(`${[e.role, [e.org, e.city].filter(has).join(', ')].filter(has).join(' — ')}${r ? ` (${r})` : ''}`);
      lines(e.bullets).forEach(b => body.push(`- ${b}`));
      body.push('');
    });
    if (k === 'education') cv.education.filter(e => has(e.degree) || has(e.school)).forEach(e => {
      const r = fmtRange(e.start, e.end, e.current, cv);
      body.push(`${[e.degree, [e.school, e.city].filter(has).join(', ')].filter(has).join(' — ')}${r ? ` (${r})` : ''}`);
      [e.grade, e.details].filter(has).forEach(x => body.push(`  ${x}`));
    });
    if (k === 'projects') cv.projects.filter(e => has(e.name)).forEach(e => { body.push(`${e.name}${has(e.link) ? ` (${shortUrl(e.link)})` : ''}`); if (has(e.desc)) body.push(`  ${e.desc.trim()}`); });
    if (k === 'achievements') (cv.achievements || []).filter(e => has(e.title)).forEach(e => { body.push(`- ${[e.title, e.org].filter(has).join(', ')}${has(e.year) ? ` (${e.year})` : ''}`); if (has(e.desc)) body.push(`  ${e.desc.trim()}`); });
    if (k === 'responsibilities' || k === 'volunteering') (cv[k] || []).filter(e => has(e.role) || has(e.org)).forEach(e => {
      const r = fmtRange(e.start, e.end, e.current, cv);
      body.push(`${[e.role, [e.org, e.city].filter(has).join(', ')].filter(has).join(' — ')}${r ? ` (${r})` : ''}`);
      lines(e.bullets).forEach(b => body.push(`- ${b}`));
      body.push('');
    });
    if (k.startsWith('custom:')) { const c = (cv.custom || []).find(x => 'custom:' + x.id === k); if (c) { const ls = lines(c.body); body = ls.length > 1 ? ls.map(l => `- ${l}`) : ls; } }
    if (k === 'certifications') cv.certifications.filter(e => has(e.name)).forEach(e => body.push(`- ${[e.name, e.issuer].filter(has).join(', ')}${has(e.year) ? ` (${e.year})` : ''}`));
    if (k === 'publications') lines(cv.publications).forEach(l => body.push(`- ${l}`));
    if (k === 'skills') body = lines(cv.skills);
    if (k === 'languages') { const ls = cv.languages.filter(l => has(l.name)); if (ls.length) body = [ls.map(l => `${l.name} (${levelLabel(l.level, cv)})`).join(', ')]; }
    if (k === 'interests' && has(cv.interests)) body = [cv.interests.trim()];
    if (k === 'references' && has(cv.references)) body = [cv.references.trim()];
    while (body.length && body[body.length - 1] === '') body.pop();
    if (body.length) { head(sectionTitle(k, cv)); out.push(...body); }
  });
  if (cv.style !== 'euro' && pItems.length && !hidden.personal) { head(L.personal); pItems.forEach(([k, v]) => out.push(`${k}: ${v}`)); }
  const d = cv.declaration || {};
  if (STYLE_FIELDS[cv.style].declaration && has(d.text)) { head(L.declaration); out.push(d.text.trim()); if (has(d.place)) out.push(`${L.place}: ${d.place}`); }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

/* ---------- CV checker ---------- */
function checkCV(cv, pages) {
  const p = cv.personal, items = [];
  const add = (ok, w, good, tip) => items.push({ ok: ok === true, half: ok === 'half', w, text: ok === true ? good : tip });
  const exp = cv.experience.filter(e => has(e.role) || has(e.org));
  const allBullets = exp.flatMap(e => lines(e.bullets));
  const allText = JSON.stringify([cv.summary, cv.experience, cv.education, cv.skills, cv.projects, cv.certifications, cv.achievements, cv.responsibilities, cv.volunteering, cv.custom, cv.letter && cv.letter.body]);

  add(has(p.fullName), 10, 'Your name is on the CV', 'Add your full name');
  add(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((p.email || '').trim()), 8, 'Email address looks right', has(p.email) ? 'Check your email address — it looks incomplete' : 'Add your email address');
  add(has(p.phone), 6, 'Phone number added', 'Add a phone number');
  add(has(p.title), 5, 'Job title under your name', 'Add a job title under your name (e.g. “Supply Chain Analyst”)');
  add(has(p.city), 3, 'Location added', 'Add your city — employers like to know where you are');
  const sl = (cv.summary || '').trim().length;
  add(sl >= 150 && sl <= 750 ? true : sl > 0 ? 'half' : false, 10, 'Summary is a good length',
    sl === 0 ? 'Write a 3–4 line summary at the top — use “Example summaries” for ideas' : sl < 150 ? 'Your summary is short — aim for 3–4 lines' : 'Your summary is long — keep it to 3–4 lines');
  const hasProj = cv.projects.some(x => has(x.name));
  add(exp.length ? true : hasProj ? 'half' : false, 12, 'Work experience added',
    hasProj ? 'No work experience yet — add an internship, part-time job or volunteering if you have one' : 'Add work experience, an internship or a project');
  if (exp.length) {
    const fewB = exp.filter(e => lines(e.bullets).length < 2);
    add(!fewB.length, 8, 'Every job has bullet points', `Add 2–5 bullet points for: ${fewB.map(e => e.role || e.org).slice(0, 2).join(', ')}`);
    const verbs = allBullets.filter(b => ALL_VERBS.has(b.split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g, ''))).length;
    add(allBullets.length && verbs / allBullets.length >= 0.6, 5, 'Bullets start with action verbs',
      'Start bullet points with action verbs like Led, Improved, Reduced — see “Phrase ideas”');
    const nums = allBullets.filter(b => /\d/.test(b)).length;
    add(allBullets.length && nums / allBullets.length >= 0.3, 6, 'Achievements include numbers',
      'Add numbers to show results — e.g. “by 20%”, “40 suppliers”, “120 students”');
    const longB = allBullets.filter(b => b.length > 220).length;
    add(!longB, 3, 'Bullet points are easy to read', `${longB} bullet point${longB > 1 ? 's are' : ' is'} very long — split or shorten ${longB > 1 ? 'them' : 'it'}`);
  }
  const ph = (allText.match(/\[[^\]\n"]{1,30}\]/g) || []).length;
  add(!ph, 6, 'No placeholders left', `Replace ${ph} placeholder${ph > 1 ? 's' : ''} like [X] with your own details`);
  add(cv.education.some(e => has(e.degree) || has(e.school)), 10, 'Education added', 'Add your education');
  const skillCount = lines(cv.skills).flatMap(l => (l.includes(':') ? l.slice(l.indexOf(':') + 1) : l).split(',')).filter(s => s.trim()).length;
  add(skillCount >= 5 ? true : skillCount ? 'half' : false, 8, 'Good list of skills', skillCount ? `Add a few more skills (you have ${skillCount}, aim for 6–12)` : 'Add your skills');
  add(cv.languages.some(l => has(l.name)), 4, 'Languages added', 'Add the languages you speak');
  add(has(p.linkedin), 4, 'LinkedIn profile linked', 'Add your LinkedIn profile link');
  if (pages) add(pages <= 2, 5, pages === 1 ? 'Fits on one page' : 'Two pages — fine for experienced people', `Your CV is ${pages} pages — try to keep it to 1–2 pages`);
  if (cv.style === 'india') add(has(cv.declaration.text) && has(cv.declaration.place), 4, 'Declaration with place is filled in', 'Fill in the place for the declaration at the end');
  if (cv.style === 'euro') add(!!p.photo, 4, 'Professional photo added', 'European CVs (especially German) usually include a professional photo');
  if (cv.style === 'canada' || cv.style === 'uk') add(true, 4, `Photo, age and marital status are left out automatically (${STYLES[cv.style].name} norm)`, '');
  if (cv.style === 'usa') add(pages ? pages === 1 || years(cv) >= 10 : true, 4, 'Fits the US one-page norm', 'US résumés are usually one page — shorten bullet points or choose Small text');
  if (cv.style === 'gulf') {
    add(!!p.photo, 3, 'Professional photo added', 'Gulf CVs usually include a professional photo');
    add(has(p.visa), 3, 'Visa status added', 'Add your visa status or notice period — Gulf employers look for it');
  }
  const weak = collectWeak(cv);
  add(!weak.length, 5, 'No weak phrases found', `${weak.length} weak phrase${weak.length > 1 ? 's' : ''} found — see “Writing check” below`);
  const total = items.reduce((s, i) => s + i.w, 0);
  const got = items.reduce((s, i) => s + (i.ok ? i.w : i.half ? i.w / 2 : 0), 0);
  return { score: Math.round(got / total * 100), items };
}

function years(cv) {
  let y = 0;
  (cv.experience || []).forEach(e => { const s = parseInt(e.start), en = e.current ? new Date().getFullYear() : parseInt(e.end); if (s && en && en >= s) y += en - s; });
  return y;
}
/* ---------- weak-phrase finder ---------- */
function findWeak(text, isBullet) {
  const out = [];
  WEAK_PHRASES.forEach(w => { if (w.re.test(text)) out.push(w); });
  if (isBullet && /^\s*i\s/i.test(text)) out.push(WEAK_START_I);
  return out;
}
function weakInField(text, bullets) {
  const seen = new Map();
  (bullets ? lines(text) : [String(text || '')]).forEach(l => findWeak(l, bullets).forEach(w => seen.set(w.phrase, w)));
  return [...seen.values()];
}
function collectWeak(cv) {
  const out = [];
  const push = (where, text, bullets) => weakInField(text, bullets).forEach(w => out.push({ where, phrase: w.phrase, tip: w.tip }));
  push('Summary', cv.summary, false);
  (cv.experience || []).forEach(e => push(`Work experience – ${e.role || e.org || 'job'}`, e.bullets, true));
  (cv.responsibilities || []).forEach(e => push(`Positions of responsibility – ${e.role || e.org || 'entry'}`, e.bullets, true));
  (cv.volunteering || []).forEach(e => push(`Volunteering – ${e.role || e.org || 'entry'}`, e.bullets, true));
  (cv.projects || []).forEach(e => push(`Projects – ${e.name || 'project'}`, e.desc, false));
  (cv.achievements || []).forEach(e => push(`Achievements – ${e.title || 'entry'}`, e.desc, false));
  (cv.custom || []).forEach(c => push(c.title || 'My section', c.body, true));
  if (cv.letter) push('Cover letter', cv.letter.body, false);
  return out;
}

/* ---------- Job ad keyword checker ---------- */
const SHORT_OK = new Set(['sap', 'erp', 'gst', 'crm', 'sql', 'kpi', 'kpis', 'wms', 'tms', 'hr', 'it', 'bi', 'ai', 'qa', 'qc', 'mba', 'bba', 'cpa', 'ca', 'po', 'b2b', 'b2c', 'ux', 'ui', 'r', 'c#', 'c++', 'aws', 'seo', 'mis', 'exim', 'mrp', 's&op']);

    raw.forEach((orig, idx) => {

      const good = !STOPWORDS.has(w) && !/^\d+$/.test(w) && (w.length >= 3 || SHORT_OK.has(w));
      if (!good) { prev = null; return; }

      if (prev) bump(bi, prev + ' ' + w, 0);
      prev = w;

  [...bi.entries()].filter(([, e]) => e.n >= 2).sort((a, b) => b[1].n - a[1].n || a[1].first - b[1].first).forEach(([k]) => {
    const ws = k.split(' ');
    if (bigrams.length < 8 && !ws.some(w => used.has(w))) { bigrams.push(k); ws.forEach(w => used.add(w)); }
  });
  const score = (k, e) => e.n + e.boost + (SHORT_OK.has(k) ? 1 : 0);
  const unis = [...uni.entries()].filter(([k, e]) => !used.has(k) && score(k, e) >= 1.8)
    .sort((a, b) => score(b[0], b[1]) - score(a[0], a[1]) || a[1].first - b[1].first)
    .slice(0, 20 - bigrams.length).map(([k]) => k);
  return bigrams.concat(unis);
}

  const terms = extractKeywords(ad);

  return terms.map(t => {
    const words = t.split(' ');
    const found = hay.includes(' ' + t + ' ') || words.every(w => hay.includes(' ' + stem(w)));
    return { term: t, found };
  });
}

  function languagesBody(cv) {

  function filledSec(cv, id) {
    if (id.startsWith('custom:')) { const c = cv.custom.find(x => 'custom:' + x.id === id); return !!(c && has(c.body)); }
    switch (id) {
      case 'personal': return has(cv.personal.fullName) && has(cv.personal.email);
      case 'summary': return has(cv.summary);
      case 'experience': case 'education': case 'projects': case 'certifications': case 'languages': case 'achievements': case 'responsibilities': case 'volunteering':
        return cv[id].some(e => Object.entries(e).some(([k, v]) => k !== 'id' && k !== 'level' && k !== 'current' && has(v)));
      case 'custom': return cv.custom.some(c => has(c.body));
      case 'skills': case 'publications': case 'interests': case 'references': return has(cv[id]);
      case 'declaration': return has(cv.declaration.text) && has(cv.declaration.place);
      case 'letter': return has(cv.letter.body);

  function metaFor(cv, id) {

    let m = w && n ? `${n} ${n > 1 ? w[1] : w[0]}` : '';

  /* ================= DOWNLOAD ================= */
  function lengthText() {
    return `Your CV is about <b>${lastPages} page${lastPages > 1 ? 's' : ''}</b> on ${paperOf(cur()).name} paper.` +
      (lastPages > 1 && longest ? ` The longest section is <b>${esc(longest)}</b>.` : '') +
      (lastPages > 2 ? ' Try to keep it to 1–2 pages: shorten bullet points, or choose Small text in Design.' : lastPages === 1 ? ' One page is ideal for freshers.' : ' Two pages is fine if you have several years of experience.');
  }
  function kwHTML(cv) {
    const res = matchKeywords(cv, cv.jobAd);
    if (!res.length) return '<p class="hint" style="margin-top:10px">No key words found yet — paste the full job advert.</p>';
    const hit = res.filter(r => r.found).length;
    return `<p style="margin:12px 0 0"><b>${hit} of ${res.length}</b> key words from the advert are in your CV (${Math.round(hit / res.length * 100)}%).</p>
      <div class="kw">${res.filter(r => !r.found).map(r => `<span class="miss">✕ ${esc(r.term)}</span>`).join('')}${res.filter(r => r.found).map(r => `<span class="hit">✓ ${esc(r.term)}</span>`).join('')}</div>
      <p class="hint" style="margin-top:10px">Add missing words only where they are true for you — for example in your summary, skills or bullet points. Then check again.</p>`;
  }
  const dlBtn = (act, icon, color, title, sub) => `<button class="dl-btn" data-act="${act}"><span class="dl-ico" style="--c:${color}">${uiIcon(icon)}</span><span><b>${title}</b><small>${sub}</small></span></button>`;
  function renderDownload() {
    const cv = cur(), r = checkCV(cv, lastPages), paper = paperOf(cv);
    const color = r.score >= 80 ? 'var(--ok)' : r.score >= 50 ? 'var(--warn)' : 'var(--bad)';
    const msg = r.score >= 90 ? 'Excellent — ready to send.' : r.score >= 75 ? 'Good. A few small things to improve.' : r.score >= 50 ? 'Getting there. Work through the tips below.' : 'Just started — follow the tips below.';

    const weak = collectWeak(cv);
    $('#panel-download').innerHTML = `
      <div class="card card-static score-card"><div class="score"><div class="ring" style="--p:${r.score};--c:${color}"><b>${r.score}</b></div><div><h3>CV score</h3><p class="hint" style="margin:0">${msg}</p></div></div>
        <ul class="tips">${todo.map(i => `<li><i>${i.half ? '◐' : '○'}</i>${esc(i.text)}</li>`).join('')}${done.map(i => `<li class="good"><i>✓</i>${esc(i.text)}</li>`).join('')}</ul></div>

  /* ================= JOBS ================= */
  function renderJobs() {
    const views = [['tracker', 'list', 'Tracker'], ['linkedin', 'linkedin', 'LinkedIn'], ['interview', 'chat', 'Interview']];
    const top = `<div class="seg seg-icons">${views.map(([v, i, l]) => `<button data-act="jobs-view" data-v="${v}" class="${jobsView === v ? 'on' : ''}">${uiIcon(i)}${l}</button>`).join('')}</div>`;
    $('#panel-jobs').innerHTML = top + (jobsView === 'tracker' ? trackerHTML() : jobsView === 'linkedin' ? linkedinHTML() : interviewHTML());
  }
  const fmtDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return d ? `${d} ${MONTHS.en[m - 1]} ${y}` : iso; };
  function trackerHTML() {
    const jobs = db.jobs.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.created || 0) - (a.created || 0));
    const count = k => jobs.filter(j => j.status === k).length;
    const sent = jobs.filter(j => j.status !== 'todo').length;
    const tiles = [['Applied', sent, '#2563EB'], ['Interviews', count('interview') + count('offer'), '#D97706'], ['Offers', count('offer'), '#16A34A'], ['To apply', count('todo'), '#7C3AED']];
    const shown = jobFilter === 'all' ? jobs : jobs.filter(j => j.status === jobFilter);
    const chips = [['all', 'All', jobs.length]].concat(Object.entries(JOB_STATUS).map(([k, s]) => [k, s.name, count(k)]));
    return `<div class="stats">${tiles.map(([l, n, c]) => `<div class="stat" style="--c:${c}"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
      <div class="card card-static">
        <div class="track-head"><h3 class="card-h" style="margin:0">${tile('briefcase', '#2563EB')}My applications</h3><button class="btn primary small" data-act="job-add">+ Add application</button></div>
        <div class="chips">${chips.map(([k, l, n]) => `<button class="chip ${jobFilter === k ? 'on' : ''}" data-act="job-filter" data-v="${k}" style="--c:${k === 'all' ? '#4F46E5' : JOB_STATUS[k].color}">${l} <span>${n}</span></button>`).join('')}</div>
        ${shown.length ? shown.map(jobCard).join('') : `<div class="empty">${uiIcon('briefcase')}<b>${jobs.length ? 'Nothing here yet' : 'No applications yet'}</b><p>Add each job you apply for — company, date, which CV you sent and the status. You will always know what to follow up.</p></div>`}
      </div>`;
  }
  function jobCard(j) {
    const st = JOB_STATUS[j.status] || JOB_STATUS.applied;
    const cvName = j.cvId && db.cvs[j.cvId] ? db.cvs[j.cvId].name : '';
    const days = j.date ? Math.floor((Date.now() - new Date(j.date + 'T00:00').getTime()) / 86400000) : 0;
    const follow = j.status === 'applied' && days >= 10 ? `<em class="follow">${days} days — follow up?</em>` : '';
    return `<div class="job-card" style="--c:${st.color}">
      <div class="job-main"><b>${esc(j.role || 'Job')}</b><span>${esc(j.company || '')}</span>
        <small>${j.date ? (j.status === 'todo' ? 'Saved ' : 'Applied ') + fmtDate(j.date) : ''}${cvName ? ` · CV: ${esc(cvName)}` : ''}</small>${follow}
        ${has(j.notes) ? `<p>${esc(j.notes)}</p>` : ''}</div>
      <div class="job-side"><select class="pill-select" data-job-status="${j.id}" aria-label="Status">${Object.entries(JOB_STATUS).map(([k, s]) => `<option value="${k}" ${k === j.status ? 'selected' : ''}>${s.name}</option>`).join('')}</select>
        <div class="btn-row">${has(j.link) ? `<a class="icon-btn" href="${esc(urlOf(j.link))}" target="_blank" rel="noopener" title="Open job advert" aria-label="Open job advert">${uiIcon('link')}</a>` : ''}<button class="icon-btn" data-act="job-edit" data-id="${j.id}" title="Edit" aria-label="Edit">${uiIcon('edit')}</button><button class="icon-btn" data-act="job-del" data-id="${j.id}" title="Delete" aria-label="Delete">${uiIcon('trash')}</button></div></div></div>`;
  }
  function jobModal(id) {
    const j = db.jobs.find(x => x.id === id) || { company: '', role: '', link: '', date: todayISO(), cvId: db.activeId, status: 'applied', notes: '' };
    const f = (label, key, type = 'text', ph = '') => `<label class="field"><span>${label}</span><input class="input" id="jf-${key}" type="${type}" value="${esc(j[key] || '')}" placeholder="${esc(ph)}"></label>`;
    openModal(id ? 'Edit application' : 'Add application', `
      <div class="row">${f('Company', 'company', 'text', 'e.g. Example Logistics')}${f('Job title', 'role', 'text', 'e.g. Supply Chain Analyst')}</div>
      ${f('Link to the job advert (optional)', 'link', 'url', 'https://…')}
      <div class="row">${f('Date', 'date', 'date')}<label class="field"><span>Status</span><select class="input" id="jf-status">${Object.entries(JOB_STATUS).map(([k, s]) => `<option value="${k}" ${k === j.status ? 'selected' : ''}>${s.name}</option>`).join('')}</select></label></div>
      <label class="field"><span>CV you sent</span><select class="input" id="jf-cvId"><option value="">—</option>${db.order.map(cid => `<option value="${cid}" ${cid === j.cvId ? 'selected' : ''}>${esc(db.cvs[cid].name)}</option>`).join('')}</select></label>
      <label class="field"><span>Notes (optional)</span><textarea class="input" id="jf-notes" rows="3" placeholder="Contact person, salary, next step…">${esc(j.notes || '')}</textarea></label>`,

      const v = k => $('#jf-' + k).value.trim();
      if (!v('company') && !v('role')) { toast('Add at least the company or the job title.'); return; }
