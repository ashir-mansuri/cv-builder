<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CV Builder – free offline CV &amp; resume maker</title>
<meta name="description" content="Make a professional CV or resume in minutes. Indian, European and Canadian styles, 4 templates, cover letter, CV score and job-advert checker. Free, works offline, nothing leaves your device.">
<meta name="theme-color" content="#4F46E5">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CV Builder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* ================= App UI ================= */
:root{
  --ui: #4F46E5; --ui-dark:#3730A3; --ui-soft:#EEF2FF;
  --ink:#1F2433; --muted:#667085; --line:#E4E7EC; --bg:#F3F4F7; --card:#fff;
  --ok:#16A34A; --warn:#D97706; --bad:#DC2626;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans',Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;white-space:nowrap}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--ui);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;letter-spacing:.5px}
.brand small{font-weight:500;color:var(--muted);font-size:12px}
.cv-switch{margin-left:auto;display:flex;align-items:center;gap:6px;max-width:48vw;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.cv-switch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save-state{font-size:12px;color:var(--muted);white-space:nowrap}
.save-state.ok::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.save-state.bad{color:var(--bad)}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,500px) 1fr}
.subhead{margin:16px 0 4px;font-size:14px;color:#344054}
.paper-sizer{position:relative;margin:0 auto}
.paper-sizer .paper-scale{position:absolute;top:0;left:0}
.editor{overflow-y:auto;border-right:1px solid var(--line);background:var(--bg);-webkit-overflow-scrolling:touch}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:4px;padding:10px 14px;background:var(--bg)}
.tab{flex:1;border:0;background:transparent;padding:10px 8px;border-radius:10px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.tab .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);font-size:12px;color:var(--muted)}
.tab.active{background:#fff;color:var(--ui);box-shadow:var(--shadow)}
.tab.active .n{background:var(--ui);color:#fff}
.panel{padding:4px 14px 120px}

.privacy{display:flex;gap:10px;align-items:flex-start;background:#ECFDF3;border:1px solid #ABEFC6;color:#05603A;border-radius:var(--radius);padding:10px 12px;font-size:13px;margin:4px 0 12px}
.privacy b{display:block}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow)}
.card>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 14px;cursor:pointer;font-weight:650;user-select:none}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.card[open]>summary::after{transform:rotate(-135deg)}
.card .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.card .dot.done{background:var(--ok)}
.card .meta{font-weight:500;color:var(--muted);font-size:13px}
.card-body{padding:0 14px 14px}
.card-static{padding:14px}
.card h3{margin:0 0 4px;font-size:15px}
.hint{color:var(--muted);font-size:13px;margin:2px 0 10px}

.field{display:block;margin-bottom:10px}
.field>span{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#344054;margin-bottom:4px}
.field input,.field select,.field textarea,.input{width:100%;border:1px solid #D0D5DD;border-radius:9px;padding:9px 11px;background:#fff;font-size:15px;outline:none;transition:border .15s,box-shadow .15s}
.field textarea{min-height:84px;resize:vertical;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{border-color:var(--ui);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--ui-soft);color:var(--ui-dark)}
.tag.off{background:#F2F4F7;color:#98A2B3}
.field.dim input,.field.dim select{background:#F9FAFB;color:#98A2B3}

.seg{display:flex;background:#EAECF0;border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:14px;color:#475467;display:flex;flex-direction:column;align-items:center;gap:1px}
.seg button small{font-weight:500;font-size:11px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.style-note{font-size:13px;color:var(--muted);margin:8px 2px 0}

.btn{border:1px solid #D0D5DD;background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:#F9FAFB}
.btn.primary{background:var(--ui);border-color:var(--ui);color:#fff}
.btn.primary:hover{background:var(--ui-dark)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ui)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;display:inline-grid;place-items:center;font-size:14px;color:#475467;padding:0}
.icon-btn:hover{background:#F9FAFB}
.icon-btn:disabled{opacity:.35;cursor:default}

.entry{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#FCFCFD}
.entry-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.entry-head b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.date-pick{display:flex;gap:6px}
.date-pick select{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:2px 0 10px}
.check input{width:18px;height:18px;accent-color:var(--ui)}
.lang-row{display:grid;grid-template-columns:1fr 1fr 32px;gap:8px;margin-bottom:8px;align-items:center}

.photo-box{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.photo-frame{width:84px;height:84px;flex:none;overflow:hidden;background:#EEF0F4;display:grid;place-items:center;color:#98A2B3;font-size:12px;text-align:center;border:1px solid var(--line)}
.photo-frame img{width:100%;height:100%;object-fit:cover}
.photo-frame.circle{border-radius:50%}.photo-frame.rounded{border-radius:14px}.photo-frame.square{border-radius:2px}
.photo-tools{flex:1;min-width:0}
.range{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px}
.range input{flex:1;accent-color:var(--ui)}

/* Design tab */
.tpl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tpl{border:2px solid var(--line);border-radius:12px;background:#fff;padding:8px;text-align:left}
.tpl.on{border-color:var(--ui);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.tpl b{display:block;font-size:14px;margin-top:6px}
.tpl small{color:var(--muted);font-size:12px}
.thumb{height:92px;border-radius:6px;background:#fff;border:1px solid var(--line);position:relative;overflow:hidden}
.thumb i{position:absolute;display:block;border-radius:2px;background:#D0D5DD}
.swatches{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.sw-custom{position:relative;width:32px;height:32px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sw-custom input{position:absolute;inset:-8px;width:48px;height:48px;opacity:0;cursor:pointer}
.font-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.font-opt{border:2px solid var(--line);border-radius:10px;background:#fff;padding:10px;text-align:left}
.font-opt.on{border-color:var(--ui)}
.font-opt span{display:block;font-size:20px;line-height:1.1}
.font-opt small{color:var(--muted);font-size:12px}
.sec-list{list-style:none;margin:0;padding:0}
.sec-list li{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line)}
.sec-list li:last-child{border-bottom:0}
.sec-list li span{flex:1;font-weight:600;font-size:14px}
.sec-list li.off span{color:#98A2B3;text-decoration:line-through}
.sec-list li em{font-style:normal;font-size:12px;color:var(--muted);font-weight:500}

/* Download tab */
.score{display:flex;align-items:center;gap:16px}
.ring{--p:0;--c:var(--ok);width:86px;height:86px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#EAECF0 0)}
.ring b{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px}
.tips{list-style:none;padding:0;margin:12px 0 0}
.tips li{display:flex;gap:8px;padding:6px 0;font-size:14px;border-top:1px dashed var(--line)}
.tips li i{font-style:normal;flex:none;width:20px;text-align:center}
.tips li.good{color:var(--muted)}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kw span{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid}
.kw .hit{background:#ECFDF3;border-color:#ABEFC6;color:#067647}
.kw .miss{background:#FEF3F2;border-color:#FECDCA;color:#B42318}
.big-actions{display:grid;gap:8px}
.big-actions .btn{padding:13px 14px;font-size:15px;justify-content:flex-start}
.big-actions .btn small{margin-left:auto;font-weight:500;color:inherit;opacity:.75;font-size:12px}
.help{font-size:13px;color:var(--muted);background:#F9FAFB;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}

/* Preview */
.preview{display:flex;flex-direction:column;min-width:0;background:#E7E9EE}
.preview-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.preview-bar .seg{width:220px}
.preview-bar .seg button{padding:6px}
.page-info{font-size:13px;color:var(--muted);margin-left:auto;text-align:right}
.page-info b{color:var(--ink)}
.page-info.over b{color:var(--warn)}
.close-preview{display:none}
.paper-wrap{flex:1;overflow:auto;padding:22px 16px 40px;-webkit-overflow-scrolling:touch}
.paper-scale{transform-origin:top left;position:relative}
.paper{background:#fff;box-shadow:0 4px 18px rgba(16,24,40,.12),0 1px 3px rgba(16,24,40,.1);position:relative}
.page-break{position:absolute;left:0;right:0;border-top:2px dashed #F79009;pointer-events:none;z-index:5}
.page-break span{position:absolute;right:6px;top:-11px;background:#F79009;color:#fff;font:600 11px/1 -apple-system,Segoe UI,sans-serif;padding:4px 7px;border-radius:5px}
.fab{display:none}

/* Modal / sheet */
.modal{position:fixed;inset:0;z-index:100;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:17px;flex:1}
.sheet-body{padding:14px 16px;overflow-y:auto}
.sheet-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.list-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.list-item.on{border-color:var(--ui);background:var(--ui-soft)}
.list-item .grow{flex:1;min-width:0}
.list-item .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .grow small{color:var(--muted)}
.phrase{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.phrase:hover{border-color:var(--ui);background:var(--ui-soft)}
.phrase::before{content:'+ ';color:var(--ui);font-weight:700}
.verbs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.verbs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px}
.verbs button:hover{border-color:var(--ui);color:var(--ui)}
.sample-card{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.sample-card:hover{border-color:var(--ui);background:var(--ui-soft)}
.sample-card b{display:block}
.sample-card small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#1F2433;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:200;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Welcome */
.welcome{max-width:560px;margin:0 auto;padding:30px 18px 60px}
.welcome h1{font-size:28px;margin:10px 0 6px;line-height:1.2}
.welcome p.lead{color:var(--muted);margin:0 0 18px}
.features{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
.features div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
.features b{display:block;font-size:14px}

@media (max-width: 900px){
  #app{display:block;height:auto}
  .layout{display:block}
  .topbar{position:static}
  .editor{overflow:visible;border:0}
  .tabs{top:0;padding-top:max(10px,env(safe-area-inset-top))}
  .preview{position:fixed;inset:0;z-index:60;visibility:hidden;transform:translateY(100%);transition:transform .25s ease,visibility 0s linear .25s}
  body.show-preview .preview{visibility:visible;transform:none;transition:transform .25s ease}
  body.show-preview{overflow:hidden}
  .close-preview{display:inline-flex}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;align-items:center;gap:8px;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:13px 18px;font-weight:700;box-shadow:0 8px 24px rgba(16,24,40,.3)}
  .save-state{display:none}
  .brand small{display:none}
  .preview-bar{padding:max(10px,env(safe-area-inset-top)) 10px 10px;gap:8px}
  .preview-bar .seg{width:auto;flex:none}
  .preview-bar .seg button{padding:6px 10px;white-space:nowrap;font-size:13px}
  .preview-bar .btn.small{padding:6px 9px}
  .page-info{font-size:12px}
  .pi-long{display:none}
  .paper-wrap{padding:14px 8px 40px}
  .modal{align-items:flex-end;padding:0}
  .sheet{border-radius:16px 16px 0 0;max-height:90vh;padding-bottom:env(safe-area-inset-bottom)}
}
@media (max-width: 420px){
  .row3{grid-template-columns:1fr 1fr}
  .features{grid-template-columns:1fr}
}

/* ================= CV paper ================= */
.cv{
  --accent:#1F3A5F; --tint:#eef2f7; --font:Helvetica,Arial,sans-serif; --fs:10.5pt;
  font-family:var(--font); font-size:var(--fs); line-height:1.34; color:#1d2230;
  padding:14mm 16mm 12mm; -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.cv *{box-sizing:border-box}
.cv a{color:inherit;text-decoration:none}
.cv p{margin:0}
.cv-name{font-size:2.35em;line-height:1.08;font-weight:700;color:var(--accent);letter-spacing:-.01em;margin:0}
.cv-title{font-size:1.15em;color:#3b4252;margin-top:1.2mm;font-weight:500}
.cv-contact{display:flex;flex-wrap:wrap;gap:1.2mm 5mm;margin-top:2.4mm;font-size:.92em;color:#3b4252}
.cv-contact span{white-space:nowrap;display:inline-flex;align-items:center}
.cv-ico{width:1.05em;height:1.05em;flex:none;margin-right:1.3mm;color:var(--accent)}
.cv-photo{overflow:hidden;flex:none;background:#eef0f4;width:31mm;height:31mm}
.cv-photo img{width:100%;height:100%;object-fit:cover;display:block}
.cv-photo.circle{border-radius:50%}.cv-photo.rounded{border-radius:3.5mm}.cv-photo.square{border-radius:.5mm}
.cv-qr{width:19mm;height:19mm;flex:none}
.cv-qr svg{width:100%;height:100%;display:block}
.cv-qr-cap{font-size:.62em;color:#667085;text-align:center;margin-top:.6mm;letter-spacing:.02em}
.cv-section{margin-top:4.6mm}
.cv-h{font-size:.98em;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin:0 0 2mm;padding-bottom:1mm;border-bottom:.35mm solid var(--accent);break-after:avoid;page-break-after:avoid}
.cv-entry{margin-bottom:2.7mm;break-inside:avoid;page-break-inside:avoid}
.cv-entry:last-child{margin-bottom:0}
.cv-entry-head{display:flex;justify-content:space-between;gap:4mm;align-items:baseline}
.cv-entry-title{font-weight:700}
.cv-entry-title .org{font-weight:500}
.cv-date{white-space:nowrap;color:#4a5263;font-size:.92em;flex:none}
.cv-entry-sub{color:#4a5263;font-size:.95em}
.cv-bullets{margin:1.1mm 0 0;padding-left:4.5mm}
.cv-bullets li{margin:.5mm 0;padding-left:.5mm}
.cv-bullets li::marker{color:var(--accent)}
.cv-skill-line{margin:.6mm 0}
.cv-skill-line b{font-weight:700}
.cv-inline{line-height:1.5}
.cv-personal{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:.6mm 5mm}
.cv-personal dt{font-weight:600;color:#3b4252}
.cv-personal dd{margin:0}
.cv-lang{display:flex;flex-wrap:wrap;gap:1mm 6mm}
.cv-lang span b{font-weight:600}
.cv-pubs{margin:0;padding-left:4.5mm}
.cv-pubs li{margin:.6mm 0;break-inside:avoid}
.cv-decl{break-inside:avoid;page-break-inside:avoid}
.cv-sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:5mm}
.cv-sign .sig{text-align:right}
.cv-sign .sig b{display:block;margin-top:1mm}
.cv-dots{display:inline-flex;gap:1mm;margin-left:2mm;vertical-align:middle}
.cv-dots i{width:1.9mm;height:1.9mm;border-radius:50%;background:currentColor;opacity:.25}
.cv-dots i.f{opacity:1}

/* --- Classic --- */
.t-classic .cv-header{display:flex;align-items:center;gap:6mm;padding-bottom:1mm}
.t-classic .cv-header-text{flex:1;min-width:0}
.t-classic.no-photo .cv-header{text-align:center}
.t-classic.no-photo .cv-contact{justify-content:center}
.t-classic.no-photo.has-qr .cv-header{text-align:left}
.t-classic.no-photo.has-qr .cv-contact{justify-content:flex-start}

/* --- Modern --- */
.t-modern{padding-top:0}
.t-modern .cv-band{background:var(--accent);color:#fff;margin:0 -16mm;padding:11mm 16mm 9mm;display:flex;align-items:center;gap:6mm}
.t-modern .cv-header-text{flex:1;min-width:0}
.t-modern .cv-name{color:#fff}
.t-modern .cv-title{color:rgba(255,255,255,.88)}
.t-modern .cv-contact{color:rgba(255,255,255,.92)}
.t-modern .cv-ico{color:#fff;opacity:.92}
.t-modern .ico-in{stroke:var(--accent)}
.t-modern .cv-photo{box-shadow:0 0 0 1mm rgba(255,255,255,.9)}

<script>
/* ---------- Tiny QR code generator (byte mode, ECC level M) ----------
   Written from the QR Code spec (ISO/IEC 18004). Works fully offline. */
const QR = (() => {
  const ECC_M = [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  const BLK_M = [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  const FORMAT_M = 0;

  function rawModules(ver) {
    let r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const n = Math.floor(ver / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (ver >= 7) r -= 36;
    }
    return r;
  }
  const dataCodewords = v => Math.floor(rawModules(v) / 8) - ECC_M[v] * BLK_M[v];

  function gfMul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11D);
      z ^= ((y >>> i) & 1) * x;
    }
    return z;
  }
  function rsDivisor(deg) {
    const r = new Array(deg).fill(0); r[deg - 1] = 1;
    let root = 1;
    for (let i = 0; i < deg; i++) {
      for (let j = 0; j < r.length; j++) {
        r[j] = gfMul(r[j], root);
        if (j + 1 < r.length) r[j] ^= r[j + 1];
      }
      root = gfMul(root, 2);
    }
    return r;
  }
  function rsRemainder(data, div) {
    const r = div.map(() => 0);
    for (const b of data) {
      const f = b ^ r.shift();
      r.push(0);
      div.forEach((c, i) => { r[i] ^= gfMul(c, f); });
    }
    return r;
  }

  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = 1;
    for (; ver <= 40; ver++) {
      const cc = ver < 10 ? 8 : 16;
      if (4 + cc + bytes.length * 8 <= dataCodewords(ver) * 8) break;
    }
    if (ver > 40) throw new Error('Text too long for a QR code');
    const size = ver * 4 + 17;
    // --- bit stream
    const bits = [];
    const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, ver < 10 ? 8 : 16);
    bytes.forEach(b => put(b, 8));
    const cap = dataCodewords(ver) * 8;
    put(0, Math.min(4, cap - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) {
      let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b);
    }
    // --- ECC + interleave
    const nb = BLK_M[ver], eccLen = ECC_M[ver], raw = Math.floor(rawModules(ver) / 8);
    const nShort = nb - raw % nb, shortLen = Math.floor(raw / nb);
    const div = rsDivisor(eccLen), blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1));
      k += dat.length;
      const ecc = rsRemainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const all = [];
    for (let i = 0; i < blocks[0].length; i++)
      blocks.forEach((bl, j) => { if (i !== shortLen - eccLen || j >= nShort) all.push(bl[i]); });

    // --- matrix
    const mod = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setF = (x, y, d) => { mod[y][x] = d; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) setF(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const align = [];
    if (ver > 1) {
      const n = Math.floor(ver / 7) + 2;
      const step = Math.floor((ver * 8 + n * 3 + 5) / (n * 4 - 4)) * 2;
      for (let p = size - 7; align.length < n - 1; p -= step) align.unshift(p);
      align.unshift(6);
    }
    align.forEach((ax, i) => align.forEach((ay, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === align.length - 1) || (i === align.length - 1 && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        setF(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }));
    const bit = (v, i) => ((v >>> i) & 1) !== 0;
    const drawFormat = mask => {
      const d = (FORMAT_M << 3) | mask;
      let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const b = ((d << 10) | rem) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setF(8, i, bit(b, i));
      setF(8, 7, bit(b, 6)); setF(8, 8, bit(b, 7)); setF(7, 8, bit(b, 8));
      for (let i = 9; i < 15; i++) setF(14 - i, 8, bit(b, i));
      for (let i = 0; i < 8; i++) setF(size - 1 - i, 8, bit(b, i));
      for (let i = 8; i < 15; i++) setF(8, size - 15 + i, bit(b, i));
      setF(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const b = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const c = bit(b, i), a = size - 11 + i % 3, bb = Math.floor(i / 3);
        setF(a, bb, c); setF(bb, a, c);
      }
    }
    // codewords
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!fn[y][x] && i < all.length * 8) { mod[y][x] = bit(all[i >>> 3], 7 - (i & 7)); i++; }
      }
    }
    const maskFn = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x) => x % 3 === 0,
      (x, y) => (x + y) % 3 === 0, (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
      (x, y) => x * y % 2 + x * y % 3 === 0, (x, y) => (x * y % 2 + x * y % 3) % 2 === 0,
      (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
    const applyMask = m => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++)
        if (!fn[y][x] && maskFn[m](x, y)) mod[y][x] = !mod[y][x];
    };
    const penalty = () => {
      let s = 0;
      const lineScore = get => {
        for (let a = 0; a < size; a++) {
          let run = 1;
          for (let b = 1; b <= size; b++) {
            if (b < size && get(a, b) === get(a, b - 1)) run++;
            else { if (run >= 5) s += run - 2; run = 1; }
          }
          for (let b = 0; b + 6 < size; b++) {
            const pat = [1, 0, 1, 1, 1, 0, 1].every((v, k) => get(a, b + k) === !!v);
            if (!pat) continue;
            const before = b >= 4 && [1, 2, 3, 4].every(k => !get(a, b - k));
            const after = b + 10 < size && [7, 8, 9, 10].every(k => !get(a, b + k));
            if (before || after) s += 40;
          }
        }
      };
      lineScore((a, b) => mod[a][b]);
      lineScore((a, b) => mod[b][a]);
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
        const c = mod[y][x];
        if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) s += 3;
      }
      let dark = 0; mod.forEach(r => r.forEach(c => { if (c) dark++; }));
      const t = size * size;
      s += (Math.ceil(Math.abs(dark * 20 - t * 10) / t) - 1) * 10;
      return s;
    };
    let best = 0, bestScore = Infinity;
    for (let m = 0; m < 8; m++) {
      applyMask(m); drawFormat(m);
      const p = penalty();
      if (p < bestScore) { bestScore = p; best = m; }
      applyMask(m);
    }
    applyMask(best); drawFormat(best);
    return { size, modules: mod };
  }

  /* Returns an SVG string. */
  function svg(text, color = '#000') {
    const { size, modules } = encode(text);
    const q = 2, n = size + q * 2;
    let d = '';
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++)
      if (modules[y][x]) d += `M${x + q},${y + q}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="${color}"/></svg>`;
  }
  return { encode, svg };
})();

function fmtYM(s, cv) {
  if (!s) return '';
  const [y, m] = String(s).split('-');
  if (!m) return y;
  if (cv.style === 'euro') return `${m}/${y}`;
  return `${MONTHS.en[+m - 1]} ${y}`;
}
function fmtRange(a, b, current, cv) {
  const L = LABELS[langOf(cv)];
  const s = fmtYM(a, cv), e = current ? L.present : fmtYM(b, cv);
  if (s && e) return `${s} – ${e}`;
  return s || e;
}
function fmtDay(iso, cv, long) {
  if (!iso) return '';
  const [y, m, d] = String(iso).split('-').map(Number);
  if (!y || !m || !d) return String(iso);
  if (langOf(cv) === 'de') return long ? `${d}. ${MONTHS_FULL_DE[m - 1]} ${y}` : `${String(d).padStart(2, '0')}.${String(m).padStart(2, '0')}.${y}`;
  if (cv.style === 'canada') return `${MONTHS_FULL[m - 1]} ${d}, ${y}`;
  if (!long) return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${y}`;
  return `${d} ${MONTHS_FULL[m - 1]} ${y}`;
}
function todayISO() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
}
function tint(hex, a = 0.1) {
  const n = parseInt(String(hex).replace('#', ''), 16) || 0;
  const mix = c => Math.round(c * a + 255 * (1 - a));
  return `rgb(${mix((n >> 16) & 255)},${mix((n >> 8) & 255)},${mix(n & 255)})`;
}
const urlOf = s => { s = String(s || '').trim(); if (!s) return ''; return /^https?:\/\//i.test(s) ? s : 'https://' + s; };
const shortUrl = s => String(s || '').trim().replace(/^https?:\/\//i, '').replace(/^www\./i, '').replace(/\/$/, '');
const safeHex = c => /^#[0-9a-f]{6}$/i.test(c || '') ? c : '#1F3A5F';

function qrTarget(cv) {
  const q = cv.qr || {}, p = cv.personal;
  return urlOf(q.link === 'website' ? p.website : q.link === 'custom' ? q.custom : p.linkedin);
}
function levelLabel(code, cv) {
  const L = LABELS[langOf(cv)];
  if (code === 'Native') return L.native;
  if (STYLE_FIELDS[cv.style].cefr) return code;
  const lv = LEVELS.find(l => l.code === code);

}
function sectionTitle(key, cv) {
  const L = LABELS[langOf(cv)];

}

function photoHTML(cv) {
  const p = cv.personal;
  if (!STYLE_FIELDS[cv.style].photo || !/^data:image\//.test(p.photo || '')) return '';
  const x = +p.photoX || 50, y = +p.photoY || 50, z = Math.max(1, +p.photoZoom || 1);
  return `<div class="cv-photo ${esc(p.photoShape || 'circle')}"><img alt="" src="${p.photo}" style="object-position:${x}% ${y}%;transform:scale(${z});transform-origin:${x}% ${y}%"></div>`;
}
function qrHTML(cv) {
  if (!cv.qr || !cv.qr.show) return '';
  const url = qrTarget(cv);
  if (!url) return '';
  const cap = cv.qr.link === 'website' ? LABELS[langOf(cv)].website : cv.qr.link === 'custom' ? 'Scan me' : 'LinkedIn';
  try {
    return `<div class="cv-qr-wrap"><div class="cv-qr">${QR.svg(url, '#111')}</div><div class="cv-qr-cap">${esc(cap)}</div></div>`;
  } catch (e) { return ''; }
}

  return `<div class="cv-entry"><div class="cv-entry-head"><div class="cv-entry-title">${esc(title)}</div>${date ? `<div class="cv-date">${esc(date)}</div>` : ''}</div>${sub ? `<div class="cv-entry-sub">${sub}</div>` : ''}${body || ''}</div>`;
}

function skillsHTML(cv, aside) {
  const ls = lines(cv.skills);
  if (!ls.length) return '';
  const grouped = ls.some(l => /^[^,:]{2,40}:/.test(l));
  if (grouped) {
    return ls.map(l => {
      const i = l.indexOf(':');
      if (i > 1 && i < 41) return `<div class="cv-skill-line"><b>${esc(l.slice(0, i))}:</b> ${esc(l.slice(i + 1).trim())}</div>`;
      return `<div class="cv-skill-line">${esc(l)}</div>`;
    }).join('');
  }
  const items = ls.flatMap(l => l.split(',')).map(s => s.trim()).filter(Boolean);
  if (aside) return items.map(s => `<div class="cv-skill-line">${esc(s)}</div>`).join('');
  return `<p class="cv-inline">${items.map(esc).join(' &nbsp;·&nbsp; ')}</p>`;
}
function langsHTML(cv, aside) {
  const ls = (cv.languages || []).filter(l => has(l.name));
  if (!ls.length) return '';
  if (aside) return `<div class="cv-lang">${ls.map(l => `<div class="cv-lang-row"><div><b>${esc(l.name)}</b><small>${esc(levelLabel(l.level, cv))}</small></div>${dotsHTML(l.level)}</div>`).join('')}</div>`;
  return `<div class="cv-lang">${ls.map(l => `<span><b>${esc(l.name)}</b> – ${esc(levelLabel(l.level, cv))}</span>`).join('')}</div>`;
}

function secContent(key, cv, tpl, aside) {
  switch (key) {
    case 'summary': return has(cv.summary) ? `<p>${nl2br(cv.summary.trim())}</p>` : '';
    case 'experience': return (cv.experience || []).filter(e => has(e.role) || has(e.org) || has(e.bullets)).map(e => entryHTML(tpl, {
      title: e.role, org: e.org, place: e.city, date: fmtRange(e.start, e.end, e.current, cv), body: bulletsHTML(e.bullets)
    })).join('');
    case 'education': return (cv.education || []).filter(e => has(e.degree) || has(e.school)).map(e => {
      const extra = [e.grade, e.details].filter(has).map(esc).join(' · ');
      return entryHTML(tpl, { title: e.degree, org: e.school, place: e.city, date: fmtRange(e.start, e.end, e.current, cv), body: extra ? `<div class="cv-entry-sub">${extra}</div>` : '' });
    }).join('');
    case 'projects': return (cv.projects || []).filter(e => has(e.name) || has(e.desc)).map(e => entryHTML(tpl, {
      title: e.name, org: has(e.link) ? shortUrl(e.link) : '', place: '', date: '', body: has(e.desc) ? `<p>${nl2br(e.desc.trim())}</p>` : ''
    })).join('');
    case 'certifications': return (cv.certifications || []).filter(e => has(e.name)).map(e => entryHTML(tpl, {
      title: e.name, org: e.issuer, place: '', date: e.year || '', body: ''
    })).join('');
    case 'publications': { const ls = lines(cv.publications); return ls.length ? `<ul class="cv-pubs">${ls.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : ''; }
    case 'skills': return skillsHTML(cv, aside);
    case 'languages': return langsHTML(cv, aside);
    case 'interests': return has(cv.interests) ? `<p class="cv-inline">${nl2br(cv.interests.trim())}</p>` : '';
    case 'references':
      return has(cv.references) ? `<p>${nl2br(cv.references.trim())}</p>` : '';
  }
  return '';
}

function declHTML(cv) {
  const d = cv.declaration || {};
  if (!STYLE_FIELDS[cv.style].declaration || !has(d.text) || (cv.hidden && cv.hidden.declaration)) return '';
  const L = LABELS.en;
  return `<section class="cv-section cv-decl" data-sec="declaration"><h2 class="cv-h">${L.declaration}</h2><p>${esc(d.text.trim())}</p>
    <div class="cv-sign"><div>${L.date}: ${d.date ? esc(fmtDay(d.date, cv)) : ''}<br>${L.place}: ${esc(d.place || '')}</div>
    <div class="sig">&nbsp;<b>(${esc(cv.personal.fullName || '')})</b></div></div></section>`;
}

function styleVars(cv) {
  const d = cv.design, color = safeHex(d.color);
  return `--accent:${color};--tint:${tint(color)};--font:${(FONTS[d.font] || FONTS.sans).css}`;
}
function nameHTML(cv) {
  const p = cv.personal;
  return `<h1 class="cv-name">${has(p.fullName) ? esc(p.fullName) : '<span style="opacity:.35">Your Name</span>'}</h1>${has(p.title) ? `<div class="cv-title">${esc(p.title)}</div>` : ''}`;
}

/* ---------- CV ---------- */
function renderCV(cv) {
  const d = cv.design, tpl = TEMPLATES[d.template] ? d.template : 'classic';
  const L = LABELS[langOf(cv)];
  const photo = photoHTML(cv), qr = qrHTML(cv);
  const hidden = cv.hidden || {};
  const order = (cv.order || SECTION_KEYS).filter(k => !hidden[k]);
  const pItems = personalItems(cv);
  const cls = ['cv', 't-' + tpl, 'size-' + (d.size || 'm'), photo ? 'has-photo' : 'no-photo', qr ? 'has-qr' : '', 'st-' + cv.style].join(' ');

  const section = (k, aside) => {
    const inner = secContent(k, cv, tpl, aside);
    if (!inner) return '';
    const pad = tpl === 'timeline' && !ENTRY_KEYS.includes(k);
    return `<section class="cv-section" data-sec="${k}"><h2 class="cv-h">${esc(sectionTitle(k, cv))}</h2>${pad ? `<div class="tl-pad">${inner}</div>` : inner}</section>`;
  };

  if (tpl === 'sidebar') {
    const asideKeys = ['skills', 'languages', 'interests'];
    const contact = contactItems(cv);
    const aside = [
      photo,
      contact.length ? `<section class="cv-section" data-sec="contact"><h2 class="cv-h">${L.contact}</h2><div class="cv-contact">${contact.map(([k, v]) => `<span><b>${esc(k)}</b>${v}</span>`).join('')}</div></section>` : '',
      pItems.length && !hidden.personal ? `<section class="cv-section" data-sec="personal"><h2 class="cv-h">${L.personal}</h2>${personalDL(pItems)}</section>` : '',
      ...order.filter(k => asideKeys.includes(k)).map(k => section(k, true)),
      qr
    ].join('');
    const main = order.filter(k => !asideKeys.includes(k)).map(k => section(k, false)).join('');
    return `<div class="${cls}" style="${styleVars(cv)}"><aside class="cv-aside">${aside}</aside><div class="cv-main">${nameHTML(cv)}${main}${declHTML(cv)}</div></div>`;
  }

  // contact line (Europe adds date of birth + nationality here)
  let contact = contactItems(cv).map(([, v, k]) => `<span>${ico(k)}${v}</span>`);
  if (cv.style === 'euro' && !hidden.personal) contact = contact.concat(euroHeaderItems(cv));
  const contactHTML = contact.length ? `<div class="cv-contact">${contact.join('')}</div>` : '';

  let header;
  if (tpl === 'modern') header = `<div class="cv-band">${photo}<div class="cv-header-text">${nameHTML(cv)}${contactHTML}</div>${qr}</div>`;
  else if (tpl === 'timeline') header = `<header class="cv-header"><div class="cv-header-text">${nameHTML(cv)}${contactHTML}</div>${photo}${qr}</header>`;
  else header = `<header class="cv-header">${photo}<div class="cv-header-text">${nameHTML(cv)}${contactHTML}</div>${qr}</header>`;

  const body = order.map(k => section(k, false)).join('');
  let personal = '';
  if (cv.style === 'india' && pItems.length && !hidden.personal) {
    const dl = personalDL(pItems);
    personal = `<section class="cv-section" data-sec="personal"><h2 class="cv-h">${L.personal}</h2>${tpl === 'timeline' ? `<div class="tl-pad">${dl}</div>` : dl}</section>`;
  }
  return `<div class="${cls}" style="${styleVars(cv)}">${header}${body}${personal}${declHTML(cv)}</div>`;
}

/* ---------- Cover letter ---------- */
function letterDefaults(cv) {
  const de = langOf(cv) === 'de';
  return {
    closing: de ? 'Mit freundlichen Grüßen' : cv.style === 'canada' ? 'Sincerely,' : 'Yours sincerely,',
    greeting: name => de ? (name ? `Guten Tag ${name},` : 'Sehr geehrte Damen und Herren,') : (name ? `Dear ${name},` : 'Dear Hiring Manager,'),
    subject: job => de ? `Bewerbung als ${job}` : `Application for the position of ${job}`
  };
}
function renderLetter(cv) {
  const d = cv.design, lt = cv.letter || {}, def = letterDefaults(cv);
  const side = d.template === 'sidebar';
  const tpl = side ? 'classic' : (TEMPLATES[d.template] ? d.template : 'classic');
  const cls = ['cv', 'cv-letter', 't-' + tpl, side ? 'letter-side' : '', 'size-' + (d.size || 'm'), 'no-photo', 'st-' + cv.style].join(' ');
  const contact = contactItems(cv).map(([, v, k]) => `<span>${ico(k)}${v}</span>`);
  const contactHTML = contact.length ? `<div class="cv-contact">${contact.join('')}</div>` : '';
  const header = tpl === 'modern'
    ? `<div class="cv-band"><div class="cv-header-text">${nameHTML(cv)}${contactHTML}</div></div>`
    : `<header class="cv-header"><div class="cv-header-text">${nameHTML(cv)}${contactHTML}</div></header>`;
  const to = [lt.recipient, lt.recipientTitle, lt.company, ...lines(lt.address)].filter(has);
  const paras = String(lt.body || '').trim()
    ? String(lt.body).trim().split(/\n\s*\n|\n/).map(s => s.trim()).filter(Boolean)
    : null;
  const bodyHTML = paras
    ? paras.map(p => `<p>${esc(p)}</p>`).join('')
    : `<p style="color:#98A2B3">Your letter text will appear here. Open “Cover letter” in the Write tab and tap “Write a first draft for me”.</p>`;
  return `<div class="${cls}" style="${styleVars(cv)}">${header}
    <div class="letter-date">${esc(fmtDay(lt.date || todayISO(), cv, true))}</div>
    ${to.length ? `<div class="letter-to">${to.map(esc).join('<br>')}</div>` : ''}
    ${has(lt.jobTitle) ? `<div class="letter-subject">${esc(def.subject(lt.jobTitle.trim()))}</div>` : ''}
    <div class="letter-body"><p>${esc(has(lt.greeting) ? lt.greeting : def.greeting((lt.recipient || '').trim()))}</p>${bodyHTML}
    <p style="margin-top:6mm">${esc(has(lt.closing) ? lt.closing : def.closing)}</p><p style="margin-top:9mm"><b>${esc(cv.personal.fullName || '')}</b></p></div></div>`;
}

function draftLetter(cv) {
  const p = cv.personal, lt = cv.letter || {};
  const job = has(lt.jobTitle) ? lt.jobTitle.trim() : '[job title]';
  const company = has(lt.company) ? lt.company.trim() : '[company name]';
  const exp = (cv.experience || []).filter(e => has(e.role) || has(e.org));
  const skills = lines(cv.skills).flatMap(l => (l.includes(':') ? l.slice(l.indexOf(':') + 1) : l).split(',')).map(s => s.replace(/\(.*?\)/g, '').trim()).filter(Boolean).slice(0, 3);
  let years = 0;
  exp.forEach(e => {
    const s = parseInt(e.start), en = e.current ? new Date().getFullYear() : parseInt(e.end);
    if (s && en && en >= s) years += en - s;
  });
  const skillText = skills.length ? skills.join(', ').replace(/, ([^,]*)$/, ' and $1') : '[your key skills]';
  if (langOf(cv) === 'de') {
    const e0 = exp[0];
    return [
      `mit großem Interesse bewerbe ich mich als ${job} bei ${company}.`,
      e0 ? `Derzeit arbeite ich als ${e0.role || '[Position]'} bei ${e0.org || '[Firma]'}. Dabei habe ich fundierte Kenntnisse in ${skillText} aufgebaut.` : `Im Studium habe ich fundierte Kenntnisse in ${skillText} aufgebaut.`,
      `${company} interessiert mich besonders, weil [Grund nennen]. Gerne möchte ich meine Erfahrung in Ihr Team einbringen.`,
      `Über eine Einladung zu einem persönlichen Gespräch freue ich mich sehr.`
    ].join('\n\n');
  }
  const intro = `I am writing to apply for the ${job} position at ${company}. ` + (exp.length && years >= 1
    ? `As a ${p.title || '[your profession]'} with ${years}+ years of experience, I am confident I can add value to your team from day one.`
    : `As a motivated ${p.title || '[your degree] graduate'}, I am eager to bring my skills and energy to your team.`);
  let middle;
  const e0 = exp[0];
  if (e0) {
    const b = lines(e0.bullets)[0];
    const lowerFirst = s => /^[A-Z][a-z]/.test(s) ? s.charAt(0).toLowerCase() + s.slice(1) : s;
    const did = b ? `I ${lowerFirst(b).replace(/\.$/, '')}.` : 'I [describe a key achievement].';
    middle = `${e0.current ? 'In my current role' : 'In my previous role'} as ${e0.role || '[role]'} at ${e0.org || '[company]'}, ${did} I have also built strong skills in ${skillText}, which match what this role needs.`;
  } else {
    const pr = (cv.projects || []).find(x => has(x.name));
    middle = `During my studies${pr ? `, I worked on a project on ${pr.name.trim()}` : ''}, and I developed practical skills in ${skillText}. I learn quickly and enjoy taking responsibility.`;
  }
  return [
    intro.replace(/\.\./g, '.'),
    middle.replace(/\.\./g, '.'),
    `I am particularly interested in ${company.replace(/\.$/, '')} because [say what attracts you to the company]. I would welcome the chance to discuss how I can support your goals.`,
    `Thank you for your time and consideration. I look forward to hearing from you.`
  ].join('\n\n');
}

/* ---------- Plain text (for job portals) ---------- */
function plainText(cv) {
  const p = cv.personal, L = LABELS[langOf(cv)], hidden = cv.hidden || {};
  const out = [];
  const head = (t) => { out.push(''); out.push(t.toUpperCase()); };
  out.push(p.fullName || '');
  if (has(p.title)) out.push(p.title);
  const c = [p.email, p.phone, [p.city, p.country].filter(has).join(', '), shortUrl(p.linkedin), shortUrl(p.website)].filter(has);
  if (c.length) out.push(c.join(' | '));
  const pItems = personalItems(cv);
  if (cv.style === 'euro' && pItems.length && !hidden.personal) out.push(pItems.map(([k, v]) => `${k}: ${v}`).join(' | '));
  (cv.order || SECTION_KEYS).filter(k => !hidden[k]).forEach(k => {
    let body = [];
    if (k === 'summary' && has(cv.summary)) body = [cv.summary.trim()];
    if (k === 'experience') cv.experience.filter(e => has(e.role) || has(e.org)).forEach(e => {
      const r = fmtRange(e.start, e.end, e.current, cv);
      body.push(`${[e.role, [e.org, e.city].filter(has).join(', ')].filter(has).join(' — ')}${r ? ` (${r})` : ''}`);
      lines(e.bullets).forEach(b => body.push(`- ${b}`));
      body.push('');
    });
    if (k === 'education') cv.education.filter(e => has(e.degree) || has(e.school)).forEach(e => {
      const r = fmtRange(e.start, e.end, e.current, cv);
      body.push(`${[e.degree, [e.school, e.city].filter(has).join(', ')].filter(has).join(' — ')}${r ? ` (${r})` : ''}`);
      [e.grade, e.details].filter(has).forEach(x => body.push(`  ${x}`));
    });
    if (k === 'projects') cv.projects.filter(e => has(e.name)).forEach(e => { body.push(`${e.name}${has(e.link) ? ` (${shortUrl(e.link)})` : ''}`); if (has(e.desc)) body.push(`  ${e.desc.trim()}`); });
    if (k === 'certifications') cv.certifications.filter(e => has(e.name)).forEach(e => body.push(`- ${[e.name, e.issuer].filter(has).join(', ')}${has(e.year) ? ` (${e.year})` : ''}`));
    if (k === 'publications') lines(cv.publications).forEach(l => body.push(`- ${l}`));
    if (k === 'skills') body = lines(cv.skills);
    if (k === 'languages') { const ls = cv.languages.filter(l => has(l.name)); if (ls.length) body = [ls.map(l => `${l.name} (${levelLabel(l.level, cv)})`).join(', ')]; }
    if (k === 'interests' && has(cv.interests)) body = [cv.interests.trim()];
    if (k === 'references' && has(cv.references)) body = [cv.references.trim()];
    while (body.length && body[body.length - 1] === '') body.pop();
    if (body.length) { head(sectionTitle(k, cv)); out.push(...body); }
  });
  if (cv.style === 'india' && pItems.length && !hidden.personal) { head(L.personal); pItems.forEach(([k, v]) => out.push(`${k}: ${v}`)); }
  const d = cv.declaration || {};
  if (STYLE_FIELDS[cv.style].declaration && has(d.text)) { head(L.declaration); out.push(d.text.trim()); if (has(d.place)) out.push(`${L.place}: ${d.place}`); }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

/* ---------- CV checker ---------- */
function checkCV(cv, pages) {
  const p = cv.personal, items = [];
  const add = (ok, w, good, tip) => items.push({ ok: ok === true, half: ok === 'half', w, text: ok === true ? good : tip });
  const exp = cv.experience.filter(e => has(e.role) || has(e.org));
  const allBullets = exp.flatMap(e => lines(e.bullets));
  const allText = JSON.stringify([cv.summary, cv.experience, cv.education, cv.skills, cv.projects, cv.certifications, cv.letter && cv.letter.body]);

  add(has(p.fullName), 10, 'Your name is on the CV', 'Add your full name');
  add(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((p.email || '').trim()), 8, 'Email address looks right', has(p.email) ? 'Check your email address — it looks incomplete' : 'Add your email address');
  add(has(p.phone), 6, 'Phone number added', 'Add a phone number');
  add(has(p.title), 5, 'Job title under your name', 'Add a job title under your name (e.g. “Supply Chain Analyst”)');
  add(has(p.city), 3, 'Location added', 'Add your city — employers like to know where you are');
  const sl = (cv.summary || '').trim().length;
  add(sl >= 150 && sl <= 750 ? true : sl > 0 ? 'half' : false, 10, 'Summary is a good length',
    sl === 0 ? 'Write a 3–4 line summary at the top — use “Example summaries” for ideas' : sl < 150 ? 'Your summary is short — aim for 3–4 lines' : 'Your summary is long — keep it to 3–4 lines');
  const hasProj = cv.projects.some(x => has(x.name));
  add(exp.length ? true : hasProj ? 'half' : false, 12, 'Work experience added',
    hasProj ? 'No work experience yet — add an internship, part-time job or volunteering if you have one' : 'Add work experience, an internship or a project');
  if (exp.length) {
    const fewB = exp.filter(e => lines(e.bullets).length < 2);
    add(!fewB.length, 8, 'Every job has bullet points', `Add 2–5 bullet points for: ${fewB.map(e => e.role || e.org).slice(0, 2).join(', ')}`);
    const verbs = allBullets.filter(b => ALL_VERBS.has(b.split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g, ''))).length;
    add(allBullets.length && verbs / allBullets.length >= 0.6, 5, 'Bullets start with action verbs',
      'Start bullet points with action verbs like Led, Improved, Reduced — see “Phrase ideas”');
    const nums = allBullets.filter(b => /\d/.test(b)).length;
    add(allBullets.length && nums / allBullets.length >= 0.3, 6, 'Achievements include numbers',
      'Add numbers to show results — e.g. “by 20%”, “40 suppliers”, “120 students”');
    const longB = allBullets.filter(b => b.length > 220).length;
    add(!longB, 3, 'Bullet points are easy to read', `${longB} bullet point${longB > 1 ? 's are' : ' is'} very long — split or shorten ${longB > 1 ? 'them' : 'it'}`);
  }
  const ph = (allText.match(/\[[^\]\n"]{1,30}\]/g) || []).length;
  add(!ph, 6, 'No placeholders left', `Replace ${ph} placeholder${ph > 1 ? 's' : ''} like [X] with your own details`);
  add(cv.education.some(e => has(e.degree) || has(e.school)), 10, 'Education added', 'Add your education');
  const skillCount = lines(cv.skills).flatMap(l => (l.includes(':') ? l.slice(l.indexOf(':') + 1) : l).split(',')).filter(s => s.trim()).length;
  add(skillCount >= 5 ? true : skillCount ? 'half' : false, 8, 'Good list of skills', skillCount ? `Add a few more skills (you have ${skillCount}, aim for 6–12)` : 'Add your skills');
  add(cv.languages.some(l => has(l.name)), 4, 'Languages added', 'Add the languages you speak');
  add(has(p.linkedin), 4, 'LinkedIn profile linked', 'Add your LinkedIn profile link');
  if (pages) add(pages <= 2, 5, pages === 1 ? 'Fits on one page' : 'Two pages — fine for experienced people', `Your CV is ${pages} pages — try to keep it to 1–2 pages`);
  if (cv.style === 'india') add(has(cv.declaration.text) && has(cv.declaration.place), 4, 'Declaration with place is filled in', 'Fill in the place for the declaration at the end');
  if (cv.style === 'euro') add(!!p.photo, 4, 'Professional photo added', 'European CVs (especially German) usually include a professional photo');
  if (cv.style === 'canada') add(true, 4, 'Photo, age and marital status are left out automatically (Canadian norm)', '');
  const total = items.reduce((s, i) => s + i.w, 0);
  const got = items.reduce((s, i) => s + (i.ok ? i.w : i.half ? i.w / 2 : 0), 0);
  return { score: Math.round(got / total * 100), items };
}

/* ---------- Job ad keyword checker ---------- */
const SHORT_OK = new Set(['sap', 'erp', 'gst', 'crm', 'sql', 'kpi', 'kpis', 'wms', 'tms', 'hr', 'it', 'bi', 'ai', 'qa', 'qc', 'mba', 'bba', 'cpa', 'ca', 'po', 'b2b', 'b2c', 'ux', 'ui', 'r', 'c#', 'c++', 'aws', 'seo', 'mis', 'exim', 'mrp', 's&op']);
function stem(w) { return w.length > 5 ? w.replace(/(ies|ing|ed|es|s|ment|ation)$/, '') : w.replace(/s$/, ''); }
function extractKeywords(text) {
  const sentences = String(text || '').split(/[.!?;:\n••()\[\]|\/]+/);
  const uni = new Map(), bi = new Map();
  let pos = 0;
  const bump = (map, k, v) => { const e = map.get(k) || { n: 0, first: pos, boost: 0 }; e.n += 1; e.boost = Math.max(e.boost, v); map.set(k, e); };
  sentences.forEach(s => {
    const raw = s.split(/[\s,"“”'’]+/).map(t => t.replace(/^[^A-Za-z0-9#+&]+|[^A-Za-z0-9#+&]+$/g, '')).filter(Boolean);
    let prev = null;
    raw.forEach((orig, idx) => {
      pos++;
      const w = orig.toLowerCase();
      const good = !STOPWORDS.has(w) && !/^\d+$/.test(w) && (w.length >= 3 || SHORT_OK.has(w));
      if (!good) { prev = null; return; }
      const caps = idx > 0 && /[A-Z]/.test(orig) ? 0.8 : 0;
      bump(uni, w, caps);
      if (prev) bump(bi, prev + ' ' + w, 0);
      prev = w;
    });
  });
  const bigrams = [], used = new Set();
  [...bi.entries()].filter(([, e]) => e.n >= 2).sort((a, b) => b[1].n - a[1].n || a[1].first - b[1].first).forEach(([k]) => {
    const ws = k.split(' ');
    if (bigrams.length < 8 && !ws.some(w => used.has(w))) { bigrams.push(k); ws.forEach(w => used.add(w)); }
  });
  const score = (k, e) => e.n + e.boost + (SHORT_OK.has(k) ? 1 : 0);
  const unis = [...uni.entries()].filter(([k, e]) => !used.has(k) && score(k, e) >= 1.8)

  /* ================= PREVIEW ================= */
  const SEC_LABEL = Object.assign({}, SECTION_NAMES, { personal: 'Personal details', declaration: 'Declaration', contact: 'Contact' });
  function renderPreview() {
    const cv = cur(); if (!cv) return;
    const paper = paperOf(cv), el = $('#paper');
    el.innerHTML = previewMode === 'letter' ? renderLetter(cv) : renderCV(cv);
    const W = paper.w * MM, H = paper.h * MM;
    el.style.width = W + 'px';
    const root = el.firstElementChild;
    root.style.minHeight = '0';
    el.style.minHeight = '0';
    const natural = root.offsetHeight;
    const contentH = natural - 11 * MM;
    const first = H - 12 * MM, next = H - 24 * MM;
    const pages = contentH <= first ? 1 : 1 + Math.ceil((contentH - first) / next);
    for (let k = 1; k < pages; k++) {
      const line = document.createElement('div');
      line.className = 'page-break'; line.style.top = (first + (k - 1) * next) + 'px';
      line.innerHTML = `<span>Page ${k + 1} starts</span>`;
      el.appendChild(line);
    }
    el.style.minHeight = (pages * H) + 'px';
    root.style.minHeight = (pages * H) + 'px';
    if (previewMode === 'cv') {
      lastPages = pages;
      let max = 0; longest = '';
      $$('[data-sec]', el).forEach(s => { if (s.offsetHeight > max) { max = s.offsetHeight; longest = SEC_LABEL[s.dataset.sec] || ''; } });
      const li = $('#lenInfo'); if (li) li.innerHTML = lengthText();
    }
    const info = $('#pageInfo');
    info.className = 'page-info' + (pages > 2 && previewMode === 'cv' ? ' over' : '');
    info.innerHTML = `<b>${pages} page${pages > 1 ? 's' : ''}</b> · ${paper.name}` + (pages > 1 && previewMode === 'cv' && longest ? `<span class="pi-long"><br>Longest: ${esc(longest)}</span>` : '');
    $$('[data-act="pmode"]').forEach(b => b.classList.toggle('on', b.dataset.v === previewMode));
    $('#fab').innerHTML = `👁 Preview <small style="opacity:.7;font-weight:500">${lastPages}p</small>`;
    fitPreview();
  }
  const schedulePreview = debounce(renderPreview, 120);
  function fitPreview() {
    const wrap = $('#paperWrap'), el = $('#paper');
    const W = el.offsetWidth, H = el.offsetHeight;
    const avail = wrap.clientWidth - (window.innerWidth <= 900 ? 16 : 32);
    if (avail <= 0 || !W) return;
    const s = zoomFull ? 1 : Math.min(1, avail / W);

    $('#zoomBtn').textContent = zoomFull ? 'Fit' : 'Zoom';

  /* ================= PRINT / EXPORT ================= */
  function doPrint(kind) {
    const cv = cur(), paper = paperOf(cv);
    const keep = previewMode;
    previewMode = 'cv'; renderPreview();
    previewMode = keep; if (keep !== 'cv') renderPreview();
    const pages = kind === 'letter' ? 1 : lastPages;
    $('#printArea').innerHTML = kind === 'letter' ? renderLetter(cv) : renderCV(cv);
    const minH = (paper.h - 12) + (pages - 1) * (paper.h - 24) - 1.5;
    $('#pageStyle').textContent = `@page{size:${paper.css};margin:12mm 0 12mm}@page:first{margin-top:0}@media print{#printArea .t-sidebar{min-height:${minH}mm}}`;
    const old = document.title;
    document.title = ((cv.personal.fullName || 'My').trim().replace(/[^\p{L}\p{N}]+/gu, '_') || 'My') + (kind === 'letter' ? '_Cover_Letter' : '_CV');
    const restore = () => { document.title = old; window.removeEventListener('afterprint', restore); };
    window.addEventListener('afterprint', restore);
    setTimeout(() => {
      try { window.print(); } catch (e) { toast('Printing is not available here — open the app in Safari or Chrome.'); }
      setTimeout(restore, 4000);
    }, 80);
  }
  async function copyText() {
    const text = plainText(cur());
    let ok = false;
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
    if (ok) { toast('Copied! Paste it into the job portal.'); return; }
    openModal('Copy your CV', `<p class="hint">Select all the text below and copy it.</p><textarea class="input" id="plainOut" rows="16" readonly>${esc(text)}</textarea>`, '<button class="btn primary" data-act="modal-close">Done</button>');
    const ta = $('#plainOut'); ta.focus(); ta.select();
  }
  function backup() {
    const data = { app: 'cv-builder', version: 1, exported: new Date().toISOString(), cvs: db.order.map(id => db.cvs[id]) };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `cv-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Backup file saved — keep it somewhere safe.');
  }
  function importBackup(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        const list = Array.isArray(d) ? d : Array.isArray(d.cvs) ? d.cvs : (d && d.personal ? [d] : null);
        if (!list || !list.length) throw new Error('empty');
        let firstId = null;
        list.slice().reverse().forEach(c => { if (c && typeof c === 'object') c.name = newName(String(c.name || 'My CV')); const n = addCV(c, false); firstId = n.id; });
        openCV(firstId);
        toast(`${list.length} CV${list.length > 1 ? 's' : ''} added from your backup.`);
      } catch (e) { toast('This file is not a CV Builder backup.'); }
    };
    r.readAsText(file);
  }
  function loadPhoto(file) {
    if (!file) return;
    if (!/^image\//.test(file.type || 'image/')) { toast('Please choose a photo (JPG or PNG).'); return; }
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 720 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        const p = cur().personal;
        p.photo = c.toDataURL('image/jpeg', 0.86);
        p.photoZoom = 1; p.photoX = 50; p.photoY = img.height > img.width * 1.1 ? 30 : 50;
        rerenderKeepScroll(renderWrite); touch();
        if (!STYLE_FIELDS[cur().style].photo) toast('Photo saved. It is hidden in Canada style — switch to India or Europe to show it.');
        else toast('Photo added. Use the sliders to adjust it.');
      };
      img.onerror = () => toast('Could not read this photo. Try a JPG or PNG.');
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }

  function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
  function confirmBox(title, text, okLabel, onOk, danger) {
    openModal(title, `<p style="margin:0">${text}</p>`, `<button class="btn" data-act="modal-close">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="confirmOk">${esc(okLabel)}</button>`);
    $('#confirmOk').onclick = () => { closeModal(); onOk(); };
  }
  function promptBox(title, label, value, onOk) {
    openModal(title, `<label class="field"><span>${esc(label)}</span><input class="input" id="promptIn" value="${esc(value)}" maxlength="60"></label>`, `<button class="btn" data-act="modal-close">Cancel</button><button class="btn primary" id="promptOk">Save</button>`);
    const inp = $('#promptIn'); inp.focus(); inp.select();
    const go = () => { const v = inp.value.trim(); closeModal(); if (v) onOk(v); };
    $('#promptOk').onclick = go;
    inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  }
  function cvMenu() {
    const items = db.order.map(id => {
      const c = db.cvs[id], st = STYLES[c.style];
      return `<div class="list-item ${id === db.activeId ? 'on' : ''}"><div class="grow"><b>${esc(c.name)}</b><small>${st.flag} ${st.name} · ${esc(c.personal.fullName || 'No name yet')} · ${ago(c.updated)}</small></div>
        ${id !== db.activeId ? `<button class="btn small" data-act="cv-open" data-id="${id}">Open</button>` : '<small style="color:var(--ui);font-weight:600">Open now</small>'}
        <button class="icon-btn" data-act="cv-rename" data-id="${id}" title="Rename" aria-label="Rename">✎</button>
        <button class="icon-btn" data-act="cv-dup" data-id="${id}" title="Make a copy" aria-label="Make a copy">⧉</button>
        <button class="icon-btn" data-act="cv-del" data-id="${id}" title="Delete" aria-label="Delete">🗑</button></div>`;
    }).join('');
    openModal('My CVs', `<p class="hint">Keep different versions — for example an Industry CV and a Teaching CV. Use ⧉ to copy one and tailor it for a specific job.</p>${items}`,
      `<button class="btn" data-act="samples">Start from a sample</button><button class="btn primary" data-act="cv-new">+ New blank CV</button>`);
  }
  function guessField(cv) {
    const t = `${cv.personal.title} ${(cv.experience[0] || {}).role || ''}`.toLowerCase();
    const map = [[/supply|logistic|demand|planning/, 'Supply Chain & Logistics'], [/procure|purchas|sourcing|buyer/, 'Procurement & Purchasing'], [/warehouse|operation|store keeper|inventory/, 'Warehouse & Operations'],
      [/teach|lectur|professor|faculty|trainer|tutor/, 'Teaching & Training'], [/sales|marketing|business develop/, 'Sales & Marketing'], [/account|financ|audit|tax|gst/, 'Accounts & Finance'],
      [/develop|software|engineer|it |web|data/, 'IT & Software'], [/customer|support|call/, 'Customer Service'], [/\bhr\b|human|recruit|admin/, 'HR & Administration'], [/student|fresher|graduate|intern/, 'Fresher / Internship']];
    const hit = map.find(([re]) => re.test(t + ' '));
    return hit ? hit[1] : 'Supply Chain & Logistics';
  }
  function phraseListHTML(f, isSum) {
    const P = PHRASES[f];
    if (isSum) return `<p class="hint">Tap to add it, then replace the [brackets] with your own details.</p><button class="phrase" data-act="phrase-add" data-text="${esc(P.summary)}">${esc(P.summary)}</button>`;
    return `<p class="hint">Tap a line to add it, then replace [X] with your real numbers.</p>${P.bullets.map(b => `<button class="phrase" data-act="phrase-add" data-text="${esc(b)}">${esc(b)}</button>`).join('')}
      <h4 class="subhead">Action verbs — start each point with one</h4>
      ${Object.entries(ACTION_VERBS).map(([g, vs]) => `<div class="hint" style="margin:6px 0 2px">${g}</div><div class="verbs">${vs.map(v => `<button data-act="verb-add" data-text="${v}">${v}</button>`).join('')}</div>`).join('')}`;
  }
  function openPhrases(target) {
    phraseTarget = target;
    const isSum = target === 'summary';
    const f = phraseField || guessField(cur());
    openModal(isSum ? 'Example summaries' : 'Phrase ideas',
      `<label class="field"><span>Your field</span><select class="input" id="phraseField">${Object.keys(PHRASES).map(k => `<option ${k === f ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select></label><div id="phraseList">${phraseListHTML(f, isSum)}</div>`,
      '<button class="btn primary" data-act="modal-close">Done</button>');
  }
  function addToTarget(text, asNewLine) {
    const cv = cur(); if (!phraseTarget) return;
    const curVal = getPath(cv, phraseTarget) || '';
    let v;
    if (phraseTarget === 'summary') v = has(curVal) ? curVal.trim() + '\n' + text : text;
    else v = has(curVal) ? curVal.replace(/\s+$/, '') + '\n' + text : text;
    setPath(cv, phraseTarget, v);
    const ta = document.querySelector(`[data-k="${phraseTarget}"]`); if (ta) ta.value = v;
    touch();
    toast(asNewLine ? `Added “${text.trim()}” — finish the sentence in the box.` : 'Added — replace the [brackets] with your details.');
  }

  /* ================= EVENTS ================= */
  function onInput(e) {
    const t = e.target;
    if (t.id === 'phraseField') { phraseField = t.value; $('#phraseList').innerHTML = phraseListHTML(t.value, phraseTarget === 'summary'); return; }
    if (t.id === 'customColor') { cur().design.color = safeHex(t.value); touch(); return; }
    const cv = cur(); if (!cv) return;
    if (t.dataset.part) {
      const w = t.closest('[data-date]');
      const y = $('[data-part="y"]', w).value, m = $('[data-part="m"]', w).value;
      setPath(cv, w.dataset.date, y ? (m ? `${y}-${m}` : y) : '');
      touch(); return;
    }
    const k = t.dataset.k; if (!k) return;
    const v = t.type === 'checkbox' ? t.checked : t.value;
    setPath(cv, k, v);
    // live bits that need small UI updates
    const parts = k.split('.');
    if (parts.length === 3) {
      const tt = $(`[data-etitle="${parts[1]}"]`);
      const list = parts[0], ent = cv[list] && cv[list].find(x => x.id === parts[1]);
      if (tt && ent) tt.textContent = entryTitle(list, ent);
      if (parts[2] === 'current') $$(`[data-date="${list}.${parts[1]}.end"] select`).forEach(s => { s.disabled = t.checked; });
    }
    if (/^personal\.photo(Zoom|X|Y)$/.test(k)) { const f = $('#photoFrame'); if (f) f.innerHTML = photoImg(cv.personal); }
    if (k === 'qr.link' || k === 'qr.show' || (k === 'personal.linkedin' && cv.qr.show && !qrTarget(cv))) { if (e.type === 'change' || t.type === 'checkbox' || t.tagName === 'SELECT') rerenderKeepScroll(renderWrite); }
    if (k === 'jobAd') return save();
    touch();
  }
  function onClick(e) {
    const b = e.target.closest('[data-act]');
    if (!b) { if (e.target.id === 'modal') closeModal(); return; }
    const act = b.dataset.act, cv = cur();
    switch (act) {
      case 'tab': setTab(b.dataset.tab); break;
      case 'style':
        cv.style = b.dataset.v; rerenderKeepScroll(renderWrite); touch();
        toast(`${STYLES[cv.style].name} style: ${STYLES[cv.style].note}`); break;
      case 'design':
        cv.design[b.dataset.f] = b.dataset.v; rerenderKeepScroll(renderDesign); touch(); break;
      case 'add': {
        const list = b.dataset.list, e2 = Object.assign({}, ENTRY_DEF[list], { id: uid() });
        if (list === 'languages') e2.level = cv.languages.length ? 'B2' : 'Native';
        cv[list].push(e2); openSet.add(list); rerenderKeepScroll(renderWrite); touch();
        const first = $(`[data-entry="${e2.id}"] input, [data-entry="${e2.id}"] textarea`);
        if (first) { first.focus({ preventScroll: true }); first.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        break;
      }
      case 'del': {
        const list = b.dataset.list, id = b.dataset.id, ent = cv[list].find(x => x.id === id);
        const doDel = () => { cv[list] = cv[list].filter(x => x.id !== id); rerenderKeepScroll(renderWrite); touch(); };
        const filledEntry = ent && Object.entries(ent).some(([k2, v2]) => !['id', 'level', 'current'].includes(k2) && has(v2));
        if (filledEntry && list !== 'languages') confirmBox('Remove this entry?', `“${esc(entryTitle(list, ent))}” will be removed from this CV.`, 'Remove', doDel, true);
        else doDel();
        break;
      }
      case 'move': {
        const list = b.dataset.list, arr = cv[list], i = arr.findIndex(x => x.id === b.dataset.id), j = i + (+b.dataset.dir);
        if (i < 0 || j < 0 || j >= arr.length) break;
        [arr[i], arr[j]] = [arr[j], arr[i]]; rerenderKeepScroll(renderWrite); touch(); break;
      }
      case 'sec-move': {
        const arr = cv.order, i = arr.indexOf(b.dataset.sec), j = i + (+b.dataset.dir);
        if (i < 0 || j < 0 || j >= arr.length) break;
        [arr[i], arr[j]] = [arr[j], arr[i]]; rerenderKeepScroll(renderDesign); touch(); break;
      }
      case 'sec-hide': cv.hidden[b.dataset.sec] = !cv.hidden[b.dataset.sec]; rerenderKeepScroll(renderDesign); touch(); break;
      case 'photo-remove': cv.personal.photo = ''; rerenderKeepScroll(renderWrite); touch(); break;
      case 'photo-shape': cv.personal.photoShape = b.dataset.v; rerenderKeepScroll(renderWrite); touch(); break;
      case 'phrases': openPhrases(b.dataset.target); break;
      case 'phrase-add': addToTarget(b.dataset.text, false); break;
      case 'verb-add': addToTarget(b.dataset.text + ' ', true); break;
      case 'draft': {
        const go = () => { cv.letter.body = draftLetter(cv); rerenderKeepScroll(renderWrite); touch(); previewMode = 'letter'; renderPreview(); toast('Draft ready — replace the [brackets] and make it your own.'); };
        if (has(cv.letter.body)) confirmBox('Replace your letter text?', 'The current letter text will be replaced by a new first draft.', 'Replace', go);
        else go();
        break;
      }
      case 'show-letter': openPreview('letter'); break;
      case 'pmode': previewMode = b.dataset.v; renderPreview(); break;
      case 'zoom': zoomFull = !zoomFull; fitPreview(); break;
      case 'preview-open': openPreview(); break;
      case 'preview-close': document.body.classList.remove('show-preview'); break;
      case 'kw': $('#kwOut').innerHTML = has(cv.jobAd) ? kwHTML(cv) : '<p class="hint" style="margin-top:10px">Paste a job advert first.</p>'; break;
      case 'print-cv': doPrint('cv'); break;
      case 'print-letter': doPrint('letter'); break;
      case 'copy-text': copyText(); break;
      case 'backup': backup(); break;
      case 'install': if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.finally(() => { deferredPrompt = null; if (tab === 'download') renderDownload(); }); } break;
      case 'modal-close': closeModal(); break;
      case 'cv-menu': cvMenu(); break;
      case 'cv-new': closeModal(); addCV({ name: newName('My CV') }); break;
      case 'cv-open': closeModal(); openCV(b.dataset.id); break;
      case 'cv-rename': { const c = db.cvs[b.dataset.id]; promptBox('Rename CV', 'Name (only you see this)', c.name, v => { c.name = v; save(); $('#cvName').textContent = cur().name; cvMenu(); }); break; }
      case 'cv-dup': {
        const c = clone(db.cvs[b.dataset.id]); c.name = newName(c.name + ' (copy)');
        closeModal(); addCV(c); toast('Copy made — tailor this version for a specific job.'); break;
      }
      case 'cv-del': {
        const id = b.dataset.id, c = db.cvs[id];
        confirmBox('Delete this CV?', `“${esc(c.name)}” will be deleted from this device. This cannot be undone. Tip: save a backup file first.`, 'Delete', () => {
          delete db.cvs[id]; db.order = db.order.filter(x => x !== id);
          if (db.activeId === id) db.activeId = db.order[0] || null;
          saveNow();
          if (!db.activeId) showWelcome(); else { showApp(); setTab(tab); cvMenu(); }
        }, true);
        break;
      }
      case 'samples': openModal('Start from a sample', `<p class="hint">A sample opens as a new CV, so nothing you have written is replaced. Change the text to your own details.</p>${samplesHTML()}`); break;
      case 'sample-load': {
        const s = SAMPLES[b.dataset.v]; const c = clone(s.cv); c.name = newName(c.name);
        closeModal(); addCV(c); toast('Sample loaded — replace the text with your own details.'); break;
      }
    }
  }
  function onChange(e) {
    const t = e.target;
    if (t.id === 'photoInput') { loadPhoto(t.files && t.files[0]); t.value = ''; return; }
    if (t.id === 'importInput') { importBackup(t.files && t.files[0]); t.value = ''; return; }
    if (t.id === 'customColor') { cur().design.color = safeHex(t.value); rerenderKeepScroll(renderDesign); touch(); return; }
    if (t.dataset && (t.dataset.k === 'qr.link')) rerenderKeepScroll(renderWrite);
  }

  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('toggle', e => {
    const d = e.target; if (!d.dataset || !d.dataset.acc) return;
    if (d.open) openSet.add(d.dataset.acc); else openSet.delete(d.dataset.acc);
  }, true);
  document.addEventListener('focusin', e => {
    const k = e.target.dataset && e.target.dataset.k; if (!k || window.innerWidth <= 900) return;
    const want = k.startsWith('letter.') ? 'letter' : (k === 'jobAd' ? previewMode : 'cv');
    if (want !== previewMode) { previewMode = want; renderPreview(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('#modal').hidden) closeModal(); else document.body.classList.remove('show-preview');
  });
  window.addEventListener('resize', debounce(fitPreview, 100));
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (tab === 'download' && cur()) renderDownload(); });
  window.addEventListener('storage', e => { if (e.key === KEY) toast('This CV was changed in another tab — reload to see the latest version.'); });

  /* ---------- start ---------- */
  if (db.activeId) { showApp(); setTab('write'); } else showWelcome();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  // for testing
  window.__cvb = { db: () => db, cur, renderPreview, checkCV: () => checkCV(cur(), lastPages), plainText: () => plainText(cur()) };
})();

</script>
</body>
</html>
