      if (id) Object.assign(j, data); else db.jobs.push(Object.assign({ id: uid(), created: Date.now() }, data));
      closeModal(); save(); renderJobs(); toast(id ? 'Application updated.' : 'Application added.');
    };
  }

  function skillItems(cv) {
    return lines(cv.skills).flatMap(l => (/^[^,:]{2,40}:/.test(l) ? l.slice(l.indexOf(':') + 1) : l).split(',')).map(s => s.trim()).filter(Boolean);
  }
  function linkedinData(cv) {
    const p = cv.personal, skills = skillItems(cv);
    const role = (p.title || '').split('|')[0].trim();
    const headline = [p.title, skills.slice(0, 3).join(' · ')].filter(has).join(' | ') || 'Add your job title and skills in the Write tab';
    const top = (cv.experience || []).flatMap(e => lines(e.bullets)).sort((a, b) => (/\d/.test(b) ? 1 : 0) - (/\d/.test(a) ? 1 : 0)).slice(0, 3);
    const about = [
      has(cv.summary) ? cv.summary.trim() : '[Write a 3–4 line summary in the Write tab — it appears here.]',
      top.length ? 'What I bring:\n' + top.map(b => '• ' + b).join('\n') : '',
      skills.length ? 'Skills: ' + skills.slice(0, 12).join(' · ') : '',
      `I am open to new opportunities${role ? ` as ${/^[aeiou]/i.test(role) ? 'an' : 'a'} ${role}` : ''}. Feel free to connect or send me a message.`
    ].filter(Boolean).join('\n\n');
    const exp = (cv.experience || []).filter(e => has(e.role) || has(e.org)).map(e => ({ title: [e.role, e.org].filter(has).join(' – '), text: lines(e.bullets).map(b => '• ' + b).join('\n') }));
    return { headline, about, exp, skills: skills.slice(0, 15).join(', ') };
  }
  const liBlock = (key, title, sub, text, limit, rows) => `<div class="li-block"><div class="li-head"><b>${esc(title)}</b><small>${esc(sub)}</small></div>
    <textarea class="input" rows="${rows}" data-li="${key}" data-limit="${limit || ''}">${esc(text)}</textarea>
    <div class="li-foot"><span class="count ${limit && text.length > limit ? 'over' : ''}" data-count="${key}">${text.length}${limit ? ` / ${limit.toLocaleString('en-US')}` : ''} characters</span><button class="btn small soft" data-act="li-copy" data-li="${key}">${uiIcon('copy')} Copy</button></div></div>`;
  function linkedinHTML() {
    const cv = cur(), d = linkedinData(cv);
    return `<div class="card card-static li-intro"><h3 class="card-h">${tile('linkedin', '#0A66C2')}LinkedIn helper</h3><p class="hint" style="margin:0">Ready-to-paste text for your LinkedIn profile, made from <b>${esc(cv.name)}</b>. Edit it here if you like, then tap Copy and paste it into LinkedIn. The About section reads best in first person (“I…”).</p></div>
      ${liBlock('h', 'Headline', 'Shown under your name — the first ~65 characters show in search', d.headline, 220, 2)}
      ${liBlock('a', 'About', 'Your profile summary — the first ~300 characters show before “See more”', d.about, 2600, 10)}
      ${d.exp.map((e, i) => liBlock('e' + i, e.title, 'Experience description', e.text || '[Add bullet points to this job in the Write tab]', 2000, 4)).join('')}
      ${liBlock('s', 'Skills', 'Add these one by one in the Skills section of your profile', d.skills || '[Add skills in the Write tab]', 0, 3)}`;
  }

  function interviewQs(field) {
    return INTERVIEW_GENERAL.map((q, i) => ({ id: 'g' + i, q: q[0], tip: q[1], group: 'g' }))
      .concat((INTERVIEW_FIELD[field] || []).map((q, i) => ({ id: `f:${field}:${i}`, q: q[0], tip: q[1], group: 'f' })));
  }
  let openQ = null;
  function interviewHTML() {
    const field = db.prep.field && INTERVIEW_FIELD[db.prep.field] ? db.prep.field : guessField(cur());
    const qs = interviewQs(field), ans = db.prep.answers;
    const done = qs.filter(q => has(ans[q.id])).length;
    const qCard = q => `<details class="q-card ${has(ans[q.id]) ? 'done' : ''}" data-q="${esc(q.id)}" ${openQ === q.id ? 'open' : ''}><summary><span class="q-dot">${uiIcon('check')}</span><span>${esc(q.q)}</span></summary>
      <div class="q-body"><p class="q-tip">💡 ${esc(q.tip)}</p><textarea class="input" rows="5" data-prep="${esc(q.id)}" placeholder="Situation: what was happening?\nTask: what did you need to do?\nAction: what did YOU do?\nResult: what happened — with numbers?">${esc(ans[q.id] || '')}</textarea><p class="hint" style="margin:4px 0 0">Saved on this device as you type. Practise saying it out loud in about 1–2 minutes.</p></div></details>`;
    return `<div class="card card-static"><h3 class="card-h">${tile('chat', '#7C3AED')}Interview prep</h3>
        <label class="field"><span>Your field</span><select class="input" id="prepField">${Object.keys(INTERVIEW_FIELD).map(k => `<option ${k === field ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select></label>
        <div class="progress"><div style="width:${Math.round(done / qs.length * 100)}%"></div></div>
        <p class="hint" style="margin:6px 0 12px">You have prepared <b>${done} of ${qs.length}</b> answers.</p>
        <button class="btn soft small" data-act="prep-random">${uiIcon('dice')} Practise a random question</button></div>
      <div class="card card-static"><h3 class="card-h" style="margin-bottom:8px">The STAR method</h3><p class="hint">For “tell me about a time…” questions, answer in four short steps:</p>
        <div class="star-grid"><div style="--c:#2563EB"><b>S</b><span>Situation</span><small>Where and when?</small></div><div style="--c:#7C3AED"><b>T</b><span>Task</span><small>What was needed?</small></div><div style="--c:#D97706"><b>A</b><span>Action</span><small>What did you do?</small></div><div style="--c:#16A34A"><b>R</b><span>Result</span><small>What changed? Use numbers.</small></div></div></div>
      <h4 class="q-group">Common questions</h4>${qs.filter(q => q.group === 'g').map(qCard).join('')}
      <h4 class="q-group">${esc(field)} questions</h4>${qs.filter(q => q.group === 'f').map(qCard).join('')}`;
  }

  /* ================= PREVIEW ================= */
  const SEC_LABEL = Object.assign({}, SECTION_NAMES, { personal: 'Personal details', declaration: 'Declaration', contact: 'Contact' });
  function renderPreview() {
    const cv = cur(); if (!cv) return;
    const paper = paperOf(cv), el = $('#paper');
    el.innerHTML = previewMode === 'letter' ? renderLetter(cv) : renderCV(cv);
    const W = paper.w * MM, H = paper.h * MM;
    el.style.width = W + 'px';
    const root = el.firstElementChild;
    root.style.minHeight = '0';
    el.style.minHeight = '0';
    const natural = root.offsetHeight;
    const contentH = natural - 11 * MM;
    const first = H - 12 * MM, next = H - 24 * MM;
    const pages = contentH <= first ? 1 : 1 + Math.ceil((contentH - first) / next);
    for (let k = 1; k < pages; k++) {
      const line = document.createElement('div');
      line.className = 'page-break'; line.style.top = (first + (k - 1) * next) + 'px';
      line.innerHTML = `<span>Page ${k + 1} starts</span>`;
      el.appendChild(line);
    }
    el.style.minHeight = (pages * H) + 'px';
    root.style.minHeight = (pages * H) + 'px';
    if (previewMode === 'cv') {
      lastPages = pages;
      let max = 0; longest = '';
      $$('[data-sec]', el).forEach(s => { if (s.offsetHeight > max) { max = s.offsetHeight; const k = s.dataset.sec; longest = k.startsWith('custom:') ? secName(cv, k) : (SEC_LABEL[k] || ''); } });
      const li = $('#lenInfo'); if (li) li.innerHTML = lengthText();
    }
    const info = $('#pageInfo');
    info.className = 'page-info' + (pages > 2 && previewMode === 'cv' ? ' over' : '');
    info.innerHTML = `<b>${pages} page${pages > 1 ? 's' : ''}</b> · ${paper.name}` + (pages > 1 && previewMode === 'cv' && longest ? `<span class="pi-long"><br>Longest: ${esc(longest)}</span>` : '');
    $$('[data-act="pmode"]').forEach(b => b.classList.toggle('on', b.dataset.v === previewMode));
    $('#fab').innerHTML = `${uiIcon('eye')} Preview <small>${lastPages}p</small>`;
    fitPreview();
  }
  const schedulePreview = debounce(renderPreview, 120);
  function fitPreview() {
    const wrap = $('#paperWrap'), el = $('#paper');
    const W = el.offsetWidth, H = el.offsetHeight;
    const avail = wrap.clientWidth - (window.innerWidth <= 900 ? 16 : 32);
    if (avail <= 0 || !W) return;
    const s = zoomFull ? 1 : Math.min(1, avail / W);
    $('#paperScale').style.transform = `scale(${s})`;
    $('#paperSizer').style.width = (W * s) + 'px';
    $('#paperSizer').style.height = (H * s) + 'px';
    $('#zoomBtn').textContent = zoomFull ? 'Fit' : 'Zoom';
  }
  function openPreview(mode) {
    if (mode) previewMode = mode;
    document.body.classList.add('show-preview');
    renderPreview();
  }

  /* ================= PRINT / EXPORT ================= */
  const fileBase = (cv, kind) => ((cv.personal.fullName || 'My').trim().replace(/[^\p{L}\p{N}]+/gu, '_') || 'My') + (kind === 'letter' ? '_Cover_Letter' : '_CV');
  function doPrint(kind) {
    const cv = cur(), paper = paperOf(cv);
    const keep = previewMode;
    previewMode = 'cv'; renderPreview();
    previewMode = keep; if (keep !== 'cv') renderPreview();
    const pages = kind === 'letter' ? 1 : lastPages;
    $('#printArea').innerHTML = kind === 'letter' ? renderLetter(cv) : renderCV(cv);
    const minH = (paper.h - 12) + (pages - 1) * (paper.h - 24) - 1.5;
    $('#pageStyle').textContent = `@page{size:${paper.css};margin:12mm 0 12mm}@page:first{margin-top:0}@media print{#printArea .t-sidebar{min-height:${minH}mm}}`;
    const old = document.title;
    document.title = fileBase(cv, kind);
    const restore = () => { document.title = old; window.removeEventListener('afterprint', restore); };
    window.addEventListener('afterprint', restore);
    setTimeout(() => {
      try { window.print(); } catch (e) { toast('Printing is not available here — open the app in Safari or Chrome.'); }
      setTimeout(restore, 4000);
    }, 80);
  }
  function downloadBlob(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  async function exportWord(kind) {
    const cv = cur();
    toast('Preparing your Word file…');
    try {
      const blob = await DOCX.build(cv, kind);
      downloadBlob(blob, fileBase(cv, kind) + '.docx');
      toast('Word file downloaded.');
    } catch (e) { toast('Sorry — the Word file could not be created.'); }
  }
  async function copyText() {
    const text = plainText(cur());
    let ok = false;
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
    if (ok) { toast('Copied! Paste it into the job portal.'); return; }
    openModal('Copy your CV', `<p class="hint">Select all the text below and copy it.</p><textarea class="input" id="plainOut" rows="16" readonly>${esc(text)}</textarea>`, '<button class="btn primary" data-act="modal-close">Done</button>');
    const ta = $('#plainOut'); ta.focus(); ta.select();
  }
  async function copyValue(text) {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); toast('Copied — now paste it into LinkedIn.'); return; } } catch (e) { /* fall through */ }
    openModal('Copy text', `<textarea class="input" id="plainOut" rows="10" readonly>${esc(text)}</textarea>`, '<button class="btn primary" data-act="modal-close">Done</button>');
    const ta = $('#plainOut'); ta.focus(); ta.select();
  }
  function backup() {
    const data = { app: 'cv-builder', version: 2, exported: new Date().toISOString(), cvs: db.order.map(id => db.cvs[id]), jobs: db.jobs, prep: db.prep };
    downloadBlob(new Blob([JSON.stringify(data)], { type: 'application/json' }), `cv-backup-${todayISO()}.json`);
    toast('Backup file saved — keep it somewhere safe.');
  }
  function importBackup(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        const list = Array.isArray(d) ? d : Array.isArray(d.cvs) ? d.cvs : (d && d.personal ? [d] : null);
        if (!list || !list.length) throw new Error('empty');
        let firstId = null;
        list.slice().reverse().forEach(c => { if (c && typeof c === 'object') c.name = newName(String(c.name || 'My CV')); const n = addCV(c, false); firstId = n.id; });
        let nj = 0;
        if (Array.isArray(d.jobs)) d.jobs.forEach(j => { if (j && j.id && !db.jobs.some(x => x.id === j.id)) { db.jobs.push(j); nj++; } });
        if (d.prep && d.prep.answers) Object.entries(d.prep.answers).forEach(([k, v]) => { if (!has(db.prep.answers[k])) db.prep.answers[k] = v; });
        openCV(firstId);
        toast(`${list.length} CV${list.length > 1 ? 's' : ''}${nj ? ` and ${nj} job application${nj > 1 ? 's' : ''}` : ''} added from your backup.`);
      } catch (e) { toast('This file is not a CV Builder backup.'); }
    };
    r.readAsText(file);
  }
  function loadPhoto(file) {
    if (!file) return;
    if (!/^image\//.test(file.type || 'image/')) { toast('Please choose a photo (JPG or PNG).'); return; }
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {

    const t = e.target;
    if (t.id === 'photoInput') { loadPhoto(t.files && t.files[0]); t.value = ''; return; }
    if (t.id === 'sigInput') { loadSignatureImage(t.files && t.files[0]); t.value = ''; return; }
    if (t.id === 'importInput') { importBackup(t.files && t.files[0]); t.value = ''; return; }
    if (t.id === 'customColor') { cur().design.color = safeHex(t.value); rerenderKeepScroll(renderDesign); touch(); }
  }

  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('toggle', e => {
    const d = e.target; if (!d.dataset) return;
    if (d.dataset.acc) { if (d.open) openSet.add(d.dataset.acc); else openSet.delete(d.dataset.acc); }
    if (d.dataset.q) { if (d.open) openQ = d.dataset.q; else if (openQ === d.dataset.q) openQ = null; }
  }, true);
  document.addEventListener('focusin', e => {
    const k = e.target.dataset && e.target.dataset.k; if (!k || window.innerWidth <= 900) return;
    const want = k.startsWith('letter.') ? 'letter' : (k === 'jobAd' ? previewMode : 'cv');
    if (want !== previewMode) { previewMode = want; renderPreview(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else document.body.classList.remove('show-preview'); return; }
    const inField = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !inField && $('#modal').hidden && cur()) { e.preventDefault(); undo(); }
  });
  window.addEventListener('resize', debounce(fitPreview, 100));
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (tab === 'download' && cur()) renderDownload(); });
  window.addEventListener('storage', e => { if (e.key === KEY) toast('This CV was changed in another tab — reload to see the latest version.'); });

  /* ---------- start ---------- */
  $$('[data-ico]').forEach(el => { el.outerHTML = uiIcon(el.dataset.ico); });
  $$('[data-logo]').forEach(el => { el.innerHTML = logoSVG(); });
  try { const fav = document.createElement('link'); fav.rel = 'icon'; fav.type = 'image/svg+xml'; fav.href = 'data:image/svg+xml,' + encodeURIComponent(logoSVG()); document.head.appendChild(fav); } catch (e) { /* PNG icon stays */ }
  if (db.activeId) { showApp(); setTab('write'); resetUndoBase(); } else showWelcome();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  window.__cvb = { db: () => db, cur, renderPreview, checkCV: () => checkCV(cur(), lastPages), plainText: () => plainText(cur()), history: () => history, undoDepth: () => (undoStacks[db.activeId] || []).length };
})();

</script>
</body>
</html>
